<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>熊罠配置 | DeS ポータル</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
  <link rel="stylesheet" href="css/style.css?v=3.26">
  <link rel="stylesheet" href="css/mobile.css?v=3.26">
</head>
<body>
  <header id="topBar">
    <div id="topTitle">
      <div><h1>熊罠・同盟配置</h1><span id="globalUpdatedAt"></span></div>
      <span id="modeBadge">閲覧モード</span>
    </div>
    <nav id="topActions" aria-label="地図の操作">
      <button id="focusTrap" type="button">🐻 熊罠へ</button>
      <button id="findMember" type="button">⌕ 同盟員検索</button>
      <button id="mapAll" type="button">全体表示</button>
      <button id="adminApproveBtn" type="button">編集</button>
      <a id="memberLink" href="./members.html" hidden>同盟員管理</a>
      <div id="currentPosTop" aria-live="polite"></div>
    </nav>
  </header>
  <div id="syncStatus" role="status">共有配置を読み込み中…</div>
  <main id="gridWrapper" aria-label="同盟配置マップ"><div id="gridStage"><div id="grid"></div></div></main>
  <section id="placementTray" aria-live="polite" hidden>
    <div class="placement-copy"><strong id="placementLabel"></strong><span id="placementHint">配置先のマスをタップしてください</span></div>
    <div class="placement-actions">
      <button id="cancelPlacement" type="button">キャンセル</button>
      <button id="confirmPlacement" class="primary" type="button" disabled>この位置に保存</button>
    </div>
  </section>
  <aside id="sheet" aria-hidden="true">
    <div class="sheet-content">
      <div class="sheet-head"><div class="sheet-handle" aria-hidden="true"></div><h2 id="sheetTitle">配置を確認</h2><button type="button" id="sheetClose" aria-label="閉じる">×</button></div>
      <div id="selectionSummary"></div>
      <div class="sheet-tabs" role="tablist" aria-label="配置の種類">
        <button type="button" role="tab" data-tab="unplaced">未配置</button>
        <button type="button" role="tab" data-tab="placed">配置済み</button>
        <button type="button" role="tab" data-tab="facilities">施設</button>
      </div>
      <label class="search-box"><span>⌕</span><input id="memberSearch" type="search" placeholder="同盟員を検索" autocomplete="off"></label>
      <div id="list"></div>
      <div id="currentPos"></div>
    </div>
  </aside>
  <dialog id="adminDialog">
    <form method="dialog" class="dialog-card">
      <h2>編集モード</h2>
      <p>配置を変更するには管理者パスワードを入力してください。</p>
      <label>管理者パスワード<input id="adminPwInput" type="password" autocomplete="current-password"></label>
      <div class="dialog-actions"><button id="adminCancelBtn" value="cancel">キャンセル</button><button id="adminSubmitBtn" class="primary" value="default">編集を開始</button></div>
    </form>
  </dialog>
  <div class="map-controls" aria-label="地図倍率"><button id="zoomOut" aria-label="地図を縮小">−</button><button id="zoomReset" aria-label="地図の倍率をリセット">100%</button><button id="zoomIn" aria-label="地図を拡大">＋</button></div>
  <div id="coordHint">スワイプで移動 · 2本指で拡大 · マスをタップして詳細表示</div>
  <script src="./js/placement-core.js?v=3.23"></script>
  <script type="module" src="./js/app.js?v=3.26"></script>
  <script src="../bridge.js"></script>
</body>
</html>
