<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>DeS ポータル</title>
<meta name="theme-color" content="#1a110a">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IM+Fell+English+SC&family=Shippori+Mincho+B1:wght@500;700&family=Zen+Kaku+Gothic+New:wght@400;500&display=swap" rel="stylesheet">
<style>
:root {
  --desk:#2B1C11; --desk-deep:#0E0805; --desk-light:#6A4527; --text:#EFE2C4; --muted:#B9A27E; --glow:#FFC57E;
  --ink:#2430A6; --paper:#F8F9FB; --paper-edge:#E2E7EF; --line:#7A5A34; --btn-bg:#22160D;
  --resin:#1B2258; --resin-lit:#7C83A6; --resin-deep:#0E1336; --resin-spec:#D6DBEA; --resin-bounce:#454C78;
  --gold:#B8924A; --gold-lit:#E2CC9C; --gold-spec:#F3E8CF; --gold-deep:#6E5530; --steel:#9AA0B6;
  --serif:"Shippori Mincho B1", "Hiragino Mincho ProN", "Yu Mincho", serif;
  --sans:"Zen Kaku Gothic New", "Hiragino Sans", "Yu Gothic", system-ui, sans-serif;
  color-scheme: dark; box-sizing:border-box;
  padding-top:env(safe-area-inset-top, 0px); padding-bottom:env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --desk:#24170E; --desk-deep:#0A0603 } }
:root[data-theme="dark"] { --desk:#24170E; --desk-deep:#0A0603 }
html, body { height:100%; margin:0; overflow:hidden }
body { background:radial-gradient(110% 95% at 50% 18%, var(--desk-light) 0%, var(--desk) 48%, var(--desk-deep) 100%); color:var(--text); font-family:var(--serif); -webkit-font-smoothing:antialiased }

/* Light rays from above (after React Bits "Light Rays") */
.rays { position:fixed; inset:-10% -20% 0; pointer-events:none; mix-blend-mode:screen; opacity:0; transform-origin:50% 0;
  background:conic-gradient(from 150deg at 38% -12%, transparent 0deg, color-mix(in srgb, var(--glow) 26%, transparent) 8deg, transparent 15deg, transparent 22deg, color-mix(in srgb, var(--glow) 18%, transparent) 28deg, transparent 36deg, color-mix(in srgb, var(--glow) 22%, transparent) 44deg, transparent 55deg, transparent 360deg); filter:blur(14px);
  -webkit-mask-image:radial-gradient(60% 75% at 50% 0%, #000 0%, transparent 80%); mask-image:radial-gradient(60% 75% at 50% 0%, #000 0%, transparent 80%) }
/* An old walnut desk: grain, knots of shadow and a dark vignette, drawn once */
.wood { position:fixed; inset:0; width:100%; height:100%; pointer-events:none; mix-blend-mode:multiply; opacity:.9 }
.vignette { position:fixed; inset:0; pointer-events:none; background:radial-gradient(80% 75% at 50% 42%, transparent 35%, rgba(8,4,2,.75) 100%) }
.fx { position:fixed; inset:0; width:100%; height:100%; pointer-events:none }
.grain { position:fixed; inset:0; pointer-events:none; opacity:.06; mix-blend-mode:overlay;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='160' height='160' filter='url(%23n)'/></svg>") }

.scene { position:fixed; inset:0; display:grid; place-items:center; padding-bottom:min(24svh, 210px) }
.world { position:relative; perspective:1500px }
.drop { position:absolute; left:50%; top:50%; border-radius:6px; background:rgba(0,0,0,.62); filter:blur(20px); pointer-events:none }
.sheet { position:relative; aspect-ratio:1500 / 1060; width:min(86vw, calc(58svh * 1.415), 1000px); transform-style:preserve-3d; will-change:transform }
.paperbg { position:absolute; inset:0 }
.paperbg svg { position:absolute; inset:0; width:100%; height:100% }
.face { position:absolute; inset:0 }
.face svg { position:absolute; inset:0; width:100%; height:100%; overflow:visible }
.face canvas { position:absolute; left:3.3333%; top:-12.7358%; width:93.4667%; height:105.8491%; pointer-events:none }
.shade { position:absolute; inset:0; background:linear-gradient(180deg, rgba(8,14,30,0), rgba(8,14,30,.55)); opacity:0; pointer-events:none }
.glare { position:absolute; inset:0; pointer-events:none; opacity:0; mix-blend-mode:soft-light;
  background:radial-gradient(45% 60% at var(--gx, 30%) var(--gy, 20%), rgba(255,244,220,.8), transparent 70%) }

/* Title, tagline and button */
.intro { position:fixed; left:0; right:0; bottom:calc(clamp(22px, 5svh, 56px) + env(safe-area-inset-bottom, 0px)); display:flex; flex-direction:column; align-items:center; gap:14px; padding:0 20px; text-align:center; pointer-events:none }
.brand { margin:0; font-family:"IM Fell English SC", var(--serif); font-weight:400; font-size:clamp(34px, 5vw, 64px); line-height:1; letter-spacing:.18em; padding-left:.18em; white-space:nowrap; color:var(--text); text-shadow:0 0 24px color-mix(in srgb, var(--glow) 35%, transparent) }
.brand span { display:inline-block; opacity:0; filter:blur(12px); transform:translateY(-.45em); transition:opacity .7s ease, filter .8s ease, transform .9s cubic-bezier(.2,.8,.2,1) }
.brand .gap { width:.35em }
.done .brand span { opacity:1; filter:blur(0); transform:none }
.brand .shine { background:linear-gradient(100deg, var(--text) 40%, #fff 50%, var(--text) 60%) 0 0 / 300% 100% no-repeat; -webkit-background-clip:text; background-clip:text; color:transparent }
.tag { margin:0; min-height:1.6em; font-family:var(--sans); font-size:clamp(13px, 1.2vw, 15px); letter-spacing:.14em; color:var(--muted) }
.enter { position:relative; isolation:isolate; overflow:hidden; margin-top:6px; display:inline-flex; align-items:center; padding:.9em 2.4em; border-radius:999px;
  color:var(--text); font-family:var(--serif); font-weight:500; font-size:15px; letter-spacing:.24em; text-decoration:none;
  opacity:0; transform:translateY(12px); pointer-events:none; transition:opacity .9s ease 1.2s, transform .9s cubic-bezier(.2,.7,.2,1) 1.2s, box-shadow .3s ease }
/* Star Border: a light that runs around the edge */
.enter::before { content:""; position:absolute; inset:-120% -20%; z-index:-2; background:conic-gradient(from 0deg, transparent 0 62%, var(--glow) 74%, #fff 76%, transparent 86%); animation:orbit 3.4s linear infinite }
.enter::after { content:""; position:absolute; inset:1px; z-index:-1; border-radius:inherit; background:var(--btn-bg); box-shadow:0 0 0 1px var(--line) inset }
.enter:hover { box-shadow:0 0 28px color-mix(in srgb, var(--glow) 35%, transparent) }
.enter:focus-visible { outline:2px solid var(--glow); outline-offset:4px }
.done .intro { pointer-events:auto }
.done .enter { opacity:1; transform:none; pointer-events:auto }
@keyframes orbit { to { transform:rotate(1turn) } }
@media (prefers-reduced-motion: reduce) { .brand span, .enter { transition:none } .enter::before { animation:none } }
</style>
</head>

    var gold = [[0, 'var(--gold-deep)'], [0.13, 'var(--gold)'], [0.23, 'var(--gold-spec)'], [0.33, 'var(--gold-lit)'], [0.55, 'var(--gold)'], [0.84, 'var(--gold-deep)'], [1, 'var(--gold)']];
    var ring = function (x, w, h) { return '<rect x="' + x + '" y="' + (-h) + '" width="' + w + '" height="' + (2 * h) + '" rx="1.2" fill="' + u('gold') + '"/>'; };
    var fins = [46, 53, 60, 67, 74].map(function (x) { return '<path d="M' + x + ' 7 V12" style="stroke:var(--resin-bounce);stroke-width:1.3"/>'; }).join('');
    return '<g class="pen-shadow"><defs><filter id="' + id('blur') + '" x="-10%" y="-80%" width="120%" height="260%"><feGaussianBlur stdDeviation="7"/></filter></defs>' +
        '<path filter="' + u('blur') + '" d="M0 0 C30 -6 60 -12 82 -13 L330 -17 C430 -18 472 -14 472 0 C472 14 430 18 330 17 L82 13 C60 12 30 6 0 0 Z" style="fill:rgba(0,0,0,.24)"/>' +
        '<ellipse cx="3" cy="1.5" rx="9" ry="3.5" style="fill:rgba(0,0,0,.3)"/></g>' +
      '<g class="pen"><defs>' + cyl('resin', resin) + cyl('gold', gold) + '</defs>' +
        '<path d="M30 4 L84 6 L84 12.8 L36 10.2 Z" style="fill:var(--resin-deep)"/>' + fins +
        '<path d="M0 0 C14 -3 30 -8 44 -11.5 C58 -14.5 70 -14 84 -13 L84 13 C70 14 58 14.5 44 11.5 C30 8 14 3 0 0 Z" fill="' + u('gold') + '"/>' +
        '<path d="M6 -1.4 C20 -4.6 32 -8.4 44 -11.3" style="fill:none;stroke:var(--gold-spec);stroke-width:1.6;stroke-linecap:round;opacity:.85"/>' +
        '<ellipse cx="1.6" cy="0" rx="3.2" ry="2.5" style="fill:var(--steel)"/>' +
        '<path d="M3.5 0 L46 0" style="stroke:var(--resin-deep);stroke-width:1"/><circle cx="48.5" cy="0" r="2.8" style="fill:var(--resin-deep)"/>' +
        '<path d="M58 -8.5 C64 -4 64 4 58 8.5 M65 -10.5 C73 -4 73 4 65 10.5" style="fill:none;stroke:var(--gold-deep);stroke-width:0.9;opacity:.7"/>' +
        '<path d="M82 -11.4 C104 -11.8 122 -13 136 -14.3 L136 14.3 C122 13 104 11.8 82 11.4 Z" fill="' + u('resin') + '"/>' + ring(136, 6, 15.2) +
        '<path d="M142 -14.9 C220 -15.7 300 -15.9 336 -15.7 L336 15.7 C300 15.9 220 15.7 142 14.9 Z" fill="' + u('resin') + '"/>' +
        '<path d="M328 -17.6 C380 -18 430 -18 452 -17.2 C466 -16.2 472 -9 472 0 C472 9 466 16.2 452 17.2 C430 18 380 18 328 17.6 Z" fill="' + u('resin') + '"/>' +
        ring(328, 7, 18.3) + ring(446, 3, 17.6) +
        '<path d="M356 -16.5 L452 -15.6 L452 -12.2 L358 -12.6 Z" style="fill:rgba(0,0,0,.28)"/>' +
        '<path d="M350 -17 C348 -24 354 -27.5 362 -27.5 L448 -25.8 C452 -25.6 455 -23 455 -20 L455 -17 Z" fill="' + u('gold') + '"/>' +
        '<circle cx="358" cy="-23.5" r="5" fill="' + u('gold') + '"/>' +
        '<path d="M150 -8.8 H322 M340 -10.2 H440 M92 -6.6 C108 -7 120 -7.8 130 -8.6" style="fill:none;stroke:var(--resin-spec);stroke-width:1.4;opacity:.5;stroke-linecap:round"/>' +
      '</g>';
  }


  // Paper, ink, pen, a glow at the nib and a sheen that runs along the finished lines.
  // Ink is painted on a canvas, pixel by pixel in drawing order (light on phones); the pen and nib glow stay in SVG.
  document.getElementById('face').innerHTML =
    '<canvas id="inkc" width="1402" height="1122"></canvas><canvas id="sheenc" width="1402" height="1122"></canvas>' +
    '<svg viewBox="-50 135 1500 1060" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg"><defs>' +
    '<radialGradient id="nibglow"><stop offset="0" stop-color="#FFC27A" stop-opacity=".5"/><stop offset="1" stop-color="#FFC27A" stop-opacity="0"/></radialGradient></defs>' +
    '<circle id="glow" r="60" fill="url(#nibglow)" opacity="0"/>' + pen('fp') + '</svg>';

  // Prepare the ink: every inked pixel, bucketed by when the pen reaches it (red channel = time, green = ink density).
  var inkC = document.getElementById('inkc'), inkX = inkC.getContext('2d'), shC = document.getElementById('sheenc'), shX = shC.getContext('2d');
  var IW = 1402, IH = 1122, alphaOf = new Uint8Array(1402 * 1122), out = null, buckets = null, level = 1, inkReady = false;
  (function () {
    var im = new Image();
    im.onload = function () {
      var c = document.createElement('canvas'); c.width = IW; c.height = IH;
      var x = c.getContext('2d', { willReadFrequently: true }); x.drawImage(im, 0, 0);
      var src = x.getImageData(0, 0, IW, IH).data;
      out = inkX.createImageData(IW, IH);
      var counts = new Uint32Array(256), n = IW * IH, i;
      for (i = 0; i < n; i++) if (src[i * 4 + 1] > 6) counts[src[i * 4]]++;
      buckets = []; var fill = [];
      for (i = 0; i < 256; i++) { buckets.push(new Uint32Array(counts[i])); fill.push(0); }
      for (i = 0; i < n; i++) {
        var g = src[i * 4 + 1]; if (g <= 6) continue;
        var r = src[i * 4]; buckets[r][fill[r]++] = i;
        out.data[i * 4] = 30; out.data[i * 4 + 1] = 38; out.data[i * 4 + 2] = 128; out.data[i * 4 + 3] = 0;
        alphaOf[i] = g;
      }
      inkReady = true;
    };
    im.src = INK;
  })();
  function revealTo(p) {
    if (!inkReady) return;
    var target = Math.min(255, Math.floor(2 + p * 248));
    if (target <= level) return;
    var x0 = IW, y0 = IH, x1 = -1, y1 = -1, d = out.data;
    for (var lv = level + 1; lv <= target; lv++) {
      var b = buckets[lv];
      for (var k = 0; k < b.length; k++) {
        var i = b[k], x = i % IW, y = (i - x) / IW;
        d[i * 4 + 3] = alphaOf[i];
        if (x < x0) x0 = x; if (x > x1) x1 = x; if (y < y0) y0 = y; if (y > y1) y1 = y;
      }
    }
    level = target;
    if (x1 >= 0) inkX.putImageData(out, 0, 0, x0, y0, x1 - x0 + 1, y1 - y0 + 1);
  }
  // A sheen that runs along the finished lines only.
  function sheen(sw) {
    shX.clearRect(0, 0, IW, IH);
    if (sw > 1 || !inkReady) return;
    var cx = -500 + 2100 * (sw < .5 ? 4 * sw * sw * sw : 1 - Math.pow(-2 * sw + 2, 3) / 2);
    shX.globalCompositeOperation = 'source-over'; shX.drawImage(inkC, 0, 0);
    shX.globalCompositeOperation = 'source-in';
    var g = shX.createLinearGradient(cx - 180, 0, cx + 180, 0);
    g.addColorStop(0, 'rgba(230,190,120,0)'); g.addColorStop(.5, 'rgba(240,205,140,' + (Math.sin(sw * Math.PI) * 0.95).toFixed(3) + ')'); g.addColorStop(1, 'rgba(230,190,120,0)');
    shX.fillStyle = g; shX.fillRect(0, 0, IW, IH);
    shX.globalCompositeOperation = 'source-over';
  }

  var $ = function (id) { return document.getElementById(id); };
  var penEl = document.querySelector('.pen'), penSh = document.querySelector('.pen-shadow');
  var sheet = $('sheet'), shade = $('shade'), glare = $('glare'), drop = $('drop'), world = $('world'), rays = $('rays');
  var glow = $('glow'), canvas = $('fx'), ctx = canvas.getContext('2d');

  var rng = function (seed) { return function () { seed = (seed * 16807) % 2147483647; return (seed - 1) / 2147483646; }; };
  // An old, untrimmed sheet: deckled edges, muted parchment, mottling, fibres and a few age spots.
  (function () {
    var r = rng(41), pts = [], N = 46;
    var jag = function (i, n) { return Math.max(0, 0.35 + 0.45 * Math.sin(i * 0.7 + r() * 0.4) + 0.5 * r()); };   // inward bite, in %
    var side = function (fn) { for (var i = 0; i < N; i++) { var u = i / N; fn(u, jag(i, N) * (u < .04 || u > .96 ? 0.4 : 1)); } };
    side(function (u, d) { pts.push([u * 100, d * 1.1]); });
    side(function (u, d) { pts.push([100 - d * 0.8, u * 100]); });
    side(function (u, d) { pts.push([100 - u * 100, 100 - d * 1.1]); });
    side(function (u, d) { pts.push([d * 0.8, 100 - u * 100]); });
    var poly = 'polygon(' + pts.map(function (p) { return p[0].toFixed(2) + '% ' + p[1].toFixed(2) + '%'; }).join(',') + ')';
    var svgPts = pts.map(function (p) { return (p[0] * 15).toFixed(1) + ',' + (p[1] * 10.6).toFixed(1); }).join(' ');
    var spots = '';
    for (var k = 0; k < 7; k++) spots += '<circle cx="' + (100 + r() * 1300).toFixed(0) + '" cy="' + (80 + r() * 900).toFixed(0) + '" r="' + (12 + r() * 46).toFixed(0) + '" fill="#7A5A2E" opacity="' + (0.05 + r() * 0.08).toFixed(3) + '" filter="url(#pb-soft)"/>';
    document.getElementById('paperbg').innerHTML =
      '<svg viewBox="0 0 1500 1060" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg"><defs>' +
        '<radialGradient id="pb-base" cx=".48" cy=".42" r=".75"><stop offset="0" stop-color="#E4D7B6"/><stop offset=".6" stop-color="#D6C59C"/><stop offset="1" stop-color="#B49A68"/></radialGradient>' +
        '<filter id="pb-mottle" x="0" y="0" width="1" height="1"><feTurbulence type="fractalNoise" baseFrequency=".006 .009" numOctaves="4" seed="7"/><feColorMatrix values="0 0 0 0 .42  0 0 0 0 .31  0 0 0 0 .16  0 0 0 .7 -.18"/></filter>' +
        '<filter id="pb-fibre" x="0" y="0" width="1" height="1"><feTurbulence type="fractalNoise" baseFrequency=".9 .04" numOctaves="2" seed="3"/><feColorMatrix values="0 0 0 0 .36  0 0 0 0 .27  0 0 0 0 .14  0 0 0 .5 -.12"/></filter>' +
        '<filter id="pb-grain" x="0" y="0" width="1" height="1"><feTurbulence type="fractalNoise" baseFrequency=".75" numOctaves="2" seed="11"/><feColorMatrix values="0 0 0 0 .3  0 0 0 0 .22  0 0 0 0 .1  0 0 0 .35 -.08"/></filter>' +
        '<filter id="pb-soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="14"/></filter>' +
        '<filter id="pb-edge" x="-5%" y="-5%" width="110%" height="110%"><feGaussianBlur stdDeviation="2.2"/></filter>' +
        '<clipPath id="pb-clip"><polygon points="' + svgPts + '"/></clipPath></defs>' +
      '<g clip-path="url(#pb-clip)"><rect width="1500" height="1060" fill="url(#pb-base)"/>' +
        '<rect width="1500" height="1060" filter="url(#pb-mottle)"/><rect width="1500" height="1060" filter="url(#pb-fibre)"/><rect width="1500" height="1060" filter="url(#pb-grain)"/>' + spots +
        '<polygon points="' + svgPts + '" fill="none" stroke="#6E5332" stroke-opacity=".55" stroke-width="10" filter="url(#pb-edge)"/></g></svg>';
    shade.style.clipPath = glare.style.clipPath = poly;
    shade.style.webkitClipPath = glare.style.webkitClipPath = poly;
  })();

  var clamp01 = function (x) { return x < 0 ? 0 : x > 1 ? 1 : x; };
  var seg = function (t, a, b) { return clamp01((t - a) / (b - a)); };
  var eo = function (x) { return 1 - Math.pow(1 - x, 3); };
  var ei = function (x) { return x * x * x; };
  var eio = function (x) { return x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2; };
  var lerp = function (a, b, x) { return a + (b - a) * x; };

  function pose(p) {
    var n = PEN.length / 3 - 1, f = clamp01(p) * n, i = Math.min(Math.floor(f), n - 1), u = f - i;
    var g = function (k, o) { return PEN[Math.min(Math.max(k, 0), n) * 3 + o]; };
    var sm = function (k, o) { return (g(k - 1, o) + 2 * g(k, o) + g(k + 1, o)) / 4; };
    var at = function (o) { return sm(i, o) + (sm(i + 1, o) - sm(i, o)) * u; };
    return { x: at(0), y: at(1), lift: 1 - at(2) };
  }

  // Title letters (Blur Text) and the decrypting tagline (Decrypted Text).
  var BRAND = 'DeS PORTAL', TAG = 'スマホでも、PCでも。同盟のツールをひとつに。', NOISE = 'アイウエオカキクケコサシスセソタチツテトナニヌネノ01ΔΣ#*';
  $('brand').innerHTML = BRAND.split('').map(function (c, i) { return c === ' ' ? '<span class="gap"></span>' : '<span aria-hidden="true" style="transition-delay:' + (i * 70) + 'ms">' + c + '</span>'; }).join('');
  var tagEl = $('tag');
  function tagAt(k) {   // k: seconds since the tagline starts
    if (k <= 0) return '';
    var shown = Math.floor(k * 30), fixed = Math.floor(Math.max(0, k - 0.35) * 28), out = '';
    for (var i = 0; i < Math.min(shown, TAG.length); i++) out += i < fixed ? TAG[i] : NOISE[(i * 7 + Math.floor(k * 20)) % NOISE.length];
    return out;
  }

  // Timeline (seconds)
  var FALL = 2.6, PEN_IN = 2.75, D0 = 3.15, DRAW = 7, D1 = D0 + DRAW, DONE = D1 + 0.4, END = D1 + 1.6;
  var mx = 0, my = 0, tiltX = 0, tiltY = 0, shOn = false;

  function paper(t) {
    var vh = window.innerHeight, w = sheet.offsetWidth, h = sheet.offsetHeight;
    var f = seg(t, 0, FALL), air = Math.pow(1 - f, 1.1);
    var y = -(vh * 0.62 + h) * Math.pow(1 - f, 2);
    var x = Math.min(window.innerWidth * 0.08, 90) * Math.sin(1.7 * t + 0.4) * air;
    var rz = -1.2 + 15 * Math.sin(2.3 * t + 0.2) * air;
    var rx = 34 * Math.sin(3.3 * t + 0.7) * air, ry = 12 * Math.sin(2.0 * t) * air;
    var k = t - FALL;
    if (k > 0) rx += 2.6 * Math.exp(-k * 6) * Math.sin(k * 22);
    // After the drawing: the sheet floats and leans toward the pointer (Tilted Card).
    var live = eio(seg(t, DONE, DONE + 1.2));
    tiltX = lerp(tiltX, -my * 7, 0.08); tiltY = lerp(tiltY, mx * 9, 0.08);
    rx += tiltX * live; ry += tiltY * live; y += -6 * Math.sin(t * 1.1) * live;
    sheet.style.transform = 'translate3d(' + x.toFixed(1) + 'px,' + y.toFixed(1) + 'px,0) rotateX(' + rx.toFixed(2) + 'deg) rotateY(' + ry.toFixed(2) + 'deg) rotateZ(' + rz.toFixed(2) + 'deg)';
    shade.style.opacity = Math.min(0.6, Math.abs(Math.sin(rx * Math.PI / 180)) * 0.9 + Math.abs(Math.sin(ry * Math.PI / 180)) * 0.5).toFixed(3);
    glare.style.opacity = (0.55 * live).toFixed(3);
    glare.style.setProperty('--gx', (50 + mx * 40).toFixed(1) + '%'); glare.style.setProperty('--gy', (35 + my * 40).toFixed(1) + '%');
    var lift = 1 - f;
    drop.style.width = w + 'px'; drop.style.height = h + 'px';
    drop.style.transform = 'translate(-50%,-50%) translate(' + (x * 0.6 + 10 - tiltY * live * 1.5).toFixed(1) + 'px,' + (22 + lift * 70 + tiltX * live * 1.5).toFixed(1) + 'px) rotate(' + rz.toFixed(2) + 'deg) scale(' + (0.96 + lift * 0.3).toFixed(3) + ')';
    drop.style.opacity = (0.06 + 0.7 * f * f * f).toFixed(3);
    // A slow camera settle as the sheet comes in.
    world.style.transform = 'scale(' + lerp(1.06, 1, eio(seg(t, 0, FALL + 0.6))).toFixed(4) + ')';
  }

  function drawing(t) {
    var p = 1.06 * seg(t, D0, D1);
    revealTo(p);
    var enter = 1 - eo(seg(t, PEN_IN, D0)), k = t - D1 - 0.15, up = eo(seg(k, 0, 0.4)), away = ei(seg(k, 0.25, 1.4));
    var hidden = t < PEN_IN || k > 1.4;
    penEl.style.visibility = penSh.style.visibility = hidden ? 'hidden' : 'visible';
    // A sheen across the finished ink, then again every 7 s.
    var sw = t > DONE ? ((t - DONE) % 7) / 1.8 : 2;
    if (sw <= 1 || shOn) { sheen(sw); shOn = sw <= 1; }
    if (hidden) { glow.setAttribute('opacity', '0'); return null; }
    var a = pose(Math.min(p, 1)), b = pose(Math.min(p + 0.004, 1));
    var lift = Math.min(1, a.lift + Math.max(up, enter)), x = a.x + away * 1000 + enter * 700, y = a.y + away * 700 + enter * 480;
    var ang = 38 + Math.max(-7, Math.min(7, (b.x - a.x) * 0.12)) + 1.5 * Math.sin(t * 5.3);
    penEl.setAttribute('transform', 'translate(' + (x - lift * 6).toFixed(1) + ' ' + (y - lift * 16).toFixed(1) + ') rotate(' + ang.toFixed(2) + ') scale(' + (1 + lift * 0.04).toFixed(3) + ')');
    penSh.setAttribute('transform', 'translate(' + (x + 6 + lift * 26).toFixed(1) + ' ' + (y + 10 + lift * 30).toFixed(1) + ') rotate(' + (ang - 4).toFixed(2) + ')');
    penSh.style.opacity = (0.55 - lift * 0.25).toFixed(3);
    glow.setAttribute('cx', x.toFixed(1)); glow.setAttribute('cy', y.toFixed(1));
    glow.setAttribute('opacity', ((1 - lift) * (t < D1 ? 1 : 0)).toFixed(3));
    return null;
  }

  // Dust in the light (Particles) and a puff of paper dust when the sheet lands.
  var W = 0, H = 0, DPR = Math.min(window.devicePixelRatio || 1, 2);
  function size() { W = window.innerWidth; H = window.innerHeight; canvas.width = W * DPR; canvas.height = H * DPR; ctx.setTransform(DPR, 0, 0, DPR, 0, 0); }
  size();
  var r = rng(7), motes = [], puff = [];
  for (var i = 0; i < 90; i++) motes.push({ x: r(), y: r(), s: 0.4 + r() * 1.6, v: 8 + r() * 22, ph: r() * 6.28, dr: (r() - .5) * 14 });
  for (var j = 0; j < 56; j++) { var side = j % 2 ? 1 : -1; puff.push({ u: r(), side: side, a: (0.05 + r() * 0.5), v: 140 + r() * 360, life: 0.9 + r() * 1.3, s: 0.6 + r() * 1.8 }); }
  var land = null;
  function particles(t) {
    ctx.clearRect(0, 0, W, H);
    var on = seg(t, 0, 2.5);
    for (var i = 0; i < motes.length; i++) {
      var m = motes[i], y = ((m.y * H - t * m.v) % H + H) % H, x = m.x * W + Math.sin(t * 0.4 + m.ph) * m.dr;
      var cone = Math.max(0, 1 - Math.abs(x - W / 2) / (W * 0.45)) * (1 - y / H * 0.7);
      var a = on * (0.15 + 0.85 * cone) * (0.35 + 0.65 * (0.5 + 0.5 * Math.sin(t * 1.7 + m.ph * 3)));
      ctx.fillStyle = 'rgba(255,206,140,' + (a * 0.7).toFixed(3) + ')';
      ctx.beginPath(); ctx.arc(x, y, m.s, 0, 6.283); ctx.fill();
    }
    var k = t - FALL;
    if (k > 0 && k < 2.4) {
      if (!land) { var rc = sheet.getBoundingClientRect(); land = { l: rc.left, r: rc.right, b: rc.bottom }; }
      for (var j = 0; j < puff.length; j++) {
        var q = puff[j], life = k / q.life; if (life >= 1) continue;
        var x0 = q.side < 0 ? land.l + q.u * 60 : land.r - q.u * 60, y0 = land.b - 4;
        var d = q.v * (1 - Math.exp(-k * 3)) / 3;
        var px = x0 + q.side * d * Math.cos(q.a), py = y0 - d * Math.sin(q.a) + 30 * k * k;
        ctx.fillStyle = 'rgba(236,214,170,' + ((1 - life) * 0.75).toFixed(3) + ')';
        ctx.beginPath(); ctx.arc(px, py, q.s * (1 + life), 0, 6.283); ctx.fill();
      }
    } else if (k <= 0) land = null;
  }

  function render(t) {
    paper(t); drawing(t); particles(t);
    rays.style.opacity = (seg(t, 0.2, 2.8) * (0.72 + 0.14 * Math.sin(t * 0.7) + 0.06 * Math.sin(t * 5.3) * Math.sin(t * 2.1))).toFixed(3);
    rays.style.transform = 'rotate(' + (2.5 * Math.sin(t * 0.21)).toFixed(3) + 'deg)';
    if (t > DONE) { document.body.classList.add('done'); tagEl.textContent = tagAt(t - DONE - 0.5); }
  }

  var t0 = performance.now(), jump = 0;
  function loop(now) { render((now - t0) / 1000 + jump); requestAnimationFrame(loop); }
  window.addEventListener('pointermove', function (e) { mx = e.clientX / window.innerWidth - 0.5; my = e.clientY / window.innerHeight - 0.5; });
  window.addEventListener('resize', function () { size(); land = null; });
  function skip() { var t = (performance.now() - t0) / 1000 + jump; if (t < END) jump += END - t; }
  $('scene').addEventListener('click', skip);
  window.addEventListener('keydown', function (e) { if (e.key === 'Escape' || e.key === ' ') skip(); });
  if (reduce) { render(END + 3); tagEl.textContent = TAG; }
  else requestAnimationFrame(loop);
})();
</script>
<script>
// 入場画面の枠の中では、読み直さずにポータルへ進む（雪山の入場画面と同じ合図）
document.getElementById('enter').addEventListener('click', function (e) { if (parent === window) return; e.preventDefault(); parent.postMessage({ type: 'des:portal-enter' }, location.origin); });
</script>
