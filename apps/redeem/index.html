<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f2f5f8"><title>ギフトコード | DeS ポータル</title><link rel="stylesheet" href="./redeem.css"><script defer src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script><script defer src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script><script defer src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script><script src="./api.js?v=3.10" defer></script><script src="./cloud.js?v=3.10" defer></script><script src="./redeem.js?v=3.10" defer></script></head>
<body><main>
<header><p class="eyebrow">ALLIANCE REWARDS</p><h1>ギフトコード</h1><p class="sub">登録プレイヤーへ順番に交換。受取履歴を残し、完了分をスキップします。</p></header>
<section class="card"><p class="eyebrow">01 / REDEEM</p><h2>コードを交換</h2><label for="cdk">ギフトコード</label><div class="code-row"><input id="cdk" placeholder="コードを入力" autocomplete="off" autocapitalize="off" spellcheck="false"><button id="startBtn" disabled>一括交換</button><button id="stopBtn" class="secondary" disabled>中止</button></div><progress id="batch-progress" value="0" max="1" aria-label="交換の進捗"></progress><p id="progress" role="status">コードを入力してください。</p><section class="recent-codes" aria-labelledby="recent-title"><h3 id="recent-title">直近の交換コード</h3><div id="recent-list"><p class="empty">交換履歴はまだありません。</p></div></section><p class="caption">他メニューに移っても処理は続きます。「中止」は送信中の1件が完了した後に止まります。</p></section>
<section class="card"><div class="section-heading"><div><p class="eyebrow">02 / PLAYERS</p><h2>登録プレイヤー <span id="count">0人</span></h2></div><input id="search" type="search" placeholder="名前・ID・王国を検索" aria-label="登録プレイヤーを検索"></div>
<details class="add-panel"><summary>プレイヤーを追加</summary><div class="form-grid"><label class="wide">プレイヤーID<textarea id="newFid" rows="2" inputmode="numeric" placeholder="複数は改行・カンマ区切り"></textarea></label><label>王国<input id="newKid" inputmode="numeric" value="2856"></label><label>メモ名（1名追加時）<input id="newName" maxlength="100"></label></div><button id="addBtn" disabled>確認して追加</button><p class="caption">公式交換APIでIDと王国を確認してから共有保存します。</p></details>
<div id="list" class="players" aria-live="polite"><p class="empty">接続後に登録プレイヤーを表示します。</p></div></section>
<section class="connection"><div><strong id="connection-title">接続を確認中…</strong><p id="connection-message" role="status">共有登録へ接続しています。</p></div><button id="retry" class="secondary">再接続</button></section>
</main><script src="../bridge.js"></script></body></html>
