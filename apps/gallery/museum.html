<script type="module">
import * as THREE from 'three';

const $ = id => document.getElementById(id);
const fail = text => { $('msgText').textContent = text; $('msg').style.display = 'flex'; };

/* 間取り（階ごとに違う）。どの階も、実在の美術館に多い「中央ホール＋大階段を展示室が囲む回遊型」。1 文字 = 2.5m 四方。
   # 壁 / 0〜9 展示室（数字は部屋番号。壁に挟まれた 1 マスは出入口） / b ベンチのある展示室マス（部屋は左隣と同じ）
   . 中央ホール / A 階段 1F⇔2F（西が下） / B 階段 2F⇔3F（東が下）。中央ホールと階段の位置は全階共通 */
const PLANS = [
  [ // 1F：8 室が一周する回廊。出入口を一直線に並べたエンフィラード
    '#################',
    '#000#1111111#222#',
    '#000#1b111b1#222#',
    '#000011111111222#',
    '##3#####.#####4##',
    '#333#.......#444#',
    '#333#.AAAAA.#444#',
    '#333.........444#',
    '#333#.BBBBB.#444#',
    '#333#.......#444#',
    '##3#####.#####4##',
    '#555566666666777#',
    '#555#6b666b6#777#',
    '#555#6666666#777#',
    '#################',
  ],
  [ // 2F：南北に建物の幅いっぱいの長い大展示室、東西に小部屋が 2 つずつ
    '#################',
    '#000000000000000#',
    '#00b000000000b00#',
    '#000000000000000#',
    '##0#####.#####0##',
    '#111#.......#333#',
    '#111#.AAAAA.#333#',
    '##1##.......##3##',
    '#222#.BBBBB.#444#',
    '#222#.......#444#',
    '##2#####.#####4##',
    '#555555555555555#',
    '#55b555555555b55#',
    '#555555555555555#',
    '#################',
  ],
  [ // 3F：東西に縦長の翼廊、北に広間、南に通路と小部屋 2 つ
    '#################',
    '#000#1111111#222#',
    '#0b0#1111111#2b2#',
    '#000011111111222#',
    '#000####.####222#',
    '#000#.......#222#',
    '#000#.AAAAA.#222#',
    '#000.........222#',
    '#000#.BBBBB.#222#',
    '#000#.......#222#',
    '#000####.####222#',
    '#000055555555222#',
    '#0b0#333#444#2b2#',
    '#000#333#444#222#',
    '#################',
  ],
];
const COLS = 17, ROWS = 15, LEVELS = 3;
const C = 2.5, H = 4.4, R = 0.35;                       // マス幅・階高・キャラの半径（m）
const cx = c => (c - 8) * C, cz = r => (r - 7) * C;     // マスの中心 → 座標
const at = (f, c, r) => PLANS[f]?.[r]?.[c] ?? '#';
const cellAt = (f, x, z) => at(f, Math.floor(x / C + 8.5), Math.floor(z / C + 7.5));
const isGallery = ch => (ch >= '0' && ch <= '9') || ch === 'b';
// 階段 k は k 階と k+1 階をつなぐ。x0 が下の端、x1 が上の端
const STAIRS = [
  { z: cz(6), x0: cx(6) - C / 2, x1: cx(10) + C / 2 },
  { z: cz(8), x0: cx(10) + C / 2, x1: cx(6) - C / 2 },
];
const stairOf = ch => 'AB'.indexOf(ch);

/* ── 高さつきの当たり判定 ──
   体の位置は (x, z) と足の高さ y。床・ベンチの上・階段の面のうち、足より下でいちばん高い面に立つ。
   柵とベンチは「その高さを越えていれば通れる」ので、跳べば柵を越えて落ちたり、ベンチに乗ったりできる。 */
const STEP = 0.35;                                      // 歩いて上れる段差
const RAIL = 0.8;                                       // 柵を越えるのに必要な高さ（見た目の柵より少し低くして跳び越えやすく）
const BODY = 1.4;                                       // 体の高さ（柵の下をくぐれないようにする）
const SLAB = 0.7;                                       // 階段の段の厚み（この下は空いていて、高さが足りればくぐれる）
const BENCH_TOP = 0.48;                                // ベンチの座面の高さ
const levelOf = y => Math.min(LEVELS - 1, Math.max(0, Math.floor((y + 0.3) / H)));   // その高さの体がいる階
// (x, z) が階段の上なら { k: 階段番号, h: その場所の階段の面の高さ }
function rampAt(x, z) {
  for (let k = 0; k < STAIRS.length; k++) {
    const s = STAIRS[k], t = (x - s.x0) / (s.x1 - s.x0);
    if (t > 0 && t < 1 && Math.abs(z - s.z) < C / 2) return { k, h: (k + t) * H };
  }
  return null;
}
const onBench = (f, x, z) => cellAt(f, x, z) === 'b' && Math.abs(x - cx(Math.floor(x / C + 8.5))) < 0.95 && Math.abs(z - cz(Math.floor(z / C + 7.5))) < 0.35;
// 足元を支える面の高さ
function supportAt(x, z, y) {
  let best = 0;
  const take = h => { if (h <= y + STEP && h > best) best = h; };
  for (let f = 0; f < LEVELS; f++) {
    const ch = cellAt(f, x, z), k = stairOf(ch);
    if (ch === '#' || (k >= 0 && f === k + 1)) continue;                             // 壁の中と、階段の吹き抜け（上の階側）に床はない
    take(f * H); if (onBench(f, x, z)) take(f * H + BENCH_TOP);
  }
  const r = rampAt(x, z); if (r) take(r.h);
  return best;
}
// 足の高さ y のまま (ox, oz) から (nx, nz) へ動けるか。carrying は誰かを持ち上げている間（階段に入れない）
function canBeAt(nx, nz, y, ox, oz, carrying = false) {
  const f = levelOf(y);
  for (const dx of [-R, R]) for (const dz of [-R, R]) {
    if (cellAt(f, nx + dx, nz + dz) === '#') return false;
    if (y < f * H + BENCH_TOP - 0.05 && onBench(f, nx + dx, nz + dz)) return false;  // ベンチは座面より高ければ上を通れる
  }
  const from = rampAt(ox, oz), to = rampAt(nx, nz);
  if (!from && !to) return true;
  const under = r => y + BODY <= r.h - SLAB;                                          // 階段の裏（段の厚みの下）に、体が立てる高さがあるか
  if (from && to && from.k === to.k) return y >= to.h - STEP || under(to);            // 階段の上を進む／階段の下をくぐる
  // 階段の縁をまたぐ
  const r = to || from, s = STAIRS[r.k], upper = (r.k + 1) * H;
  const [outX, outZ] = to ? [ox, oz] : [nx, nz];
  if (to && y < to.h - STEP) { if (!under(to)) return false; }                        // 階段の下へは、頭がつかえない所だけ入れる
  else if (to && carrying) return false;
  const hitsUpperRail = y > upper - 0.9 && y < upper + RAIL;                          // 上の階の吹き抜けの柵（階段の中ほどから跳び下りられるよう、下側は甘め）
  if (Math.abs(outZ - s.z) >= C / 2) return !hitsUpperRail && !(y > r.h - BODY && y < r.h + RAIL);   // 長い辺：斜めの柵もある
  return (outX - s.x0) / (s.x1 - s.x0) >= 1 || !hitsUpperRail;                        // 下の端は吹き抜けの柵だけ／上の端は開いている
}
console.assert(PLANS.length === LEVELS && PLANS.every(p => p.length === ROWS && p.every(r => r.length === COLS)), '間取りの大きさが不正');
// 階段は上下の階で同じ位置に無いと上り下りできない。両端のマスも歩ける床であること
console.assert([0, 1].every(f => PLANS[f][6].slice(5, 12) === '.AAAAA.') && [1, 2].every(f => PLANS[f][8].slice(5, 12) === '.BBBBB.'), '階段の位置が階によってずれている');

// 展示データはギャラリーページ（index.html の loadGallery）が localStorage に保存したものを使う
const httpUrl = v => { try { const u = new URL(v); return /^https?:$/.test(u.protocol) ? u.href : ''; } catch (_) { return ''; } };
let items = [];
try { items = JSON.parse(localStorage.getItem('gallery_museum_items') || '[]'); } catch (_) {}
items = (Array.isArray(items) ? items : [])
  .map(i => ({ title: String(i?.title || ''), thumb: httpUrl(i?.thumb), full: httpUrl(i?.full) }))
  .filter(i => i.thumb);
// ?preview=1 では本番の画像に触れず、同梱のサンプルを飾る（ギャラリー本体のプレビューと同じ考え方）
if (new URLSearchParams(location.search).get('preview') === '1') {
  items = Array.from({ length: 24 }, (_, i) => {
    const url = new URL(`frames/f_${String(1 + i * 5).padStart(3, '0')}.jpg`, location.href).href;
    return { title: `表示確認用サンプル ${i + 1}`, thumb: url, full: url };
  });
}

if (!items.length) {
  fail('展示する作品がまだ読み込まれていません。先にギャラリーを開いてから、もう一度お入りください。');
} else {
  try { start(); } catch (e) { console.error(e); fail('この端末では3D表示を開始できませんでした。'); }
}

function start() {
  const renderer = new THREE.WebGLRenderer({ canvas: $('c'), antialias: true });
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0x0e0806);
  const camera = new THREE.PerspectiveCamera(60, 1, 0.1, 120);
  // 縦持ちのスマホ（タッチ端末で縦長）のときは .turned を付けて横向き表示にする。PC の縦長ウィンドウは回さない
  const stage = $('stage'), root = document.documentElement, portraitPhone = matchMedia('(orientation: portrait) and (pointer: coarse)');
  const turned = () => root.classList.contains('turned');
  const resize = () => { const w = stage.clientWidth, h = stage.clientHeight; renderer.setSize(w, h, false); camera.aspect = w / h; camera.updateProjectionMatrix(); };
  const applyTurn = () => { root.classList.toggle('turned', portraitPhone.matches); resize(); };
  portraitPhone.addEventListener('change', applyTurn); addEventListener('resize', resize); applyTurn();

  // 全体は暗めにして、絵ごとのスポットライト（壁の光だまり）を目立たせる
  scene.add(new THREE.HemisphereLight(0xfff1dc, 0x6a5a50, 1.9));
  const sun = new THREE.DirectionalLight(0xffffff, 0.7); sun.position.set(3, 8, 5); scene.add(sun);

  const std = (color, roughness = 0.9) => new THREE.MeshStandardMaterial({ color, roughness });
  const M4 = new THREE.Matrix4(), Q = new THREE.Quaternion(), V = new THREE.Vector3(), S = new THREE.Vector3(), E = new THREE.Euler();
  // たくさん並ぶ同じ形はまとめて描く（list: [{x,y,z, ry?, sy?}]）
  const instanced = (geo, material, list, parent = scene) => {
    const m = new THREE.InstancedMesh(geo, material, list.length);
    list.forEach((o, i) => {
      m.setMatrixAt(i, M4.compose(V.set(o.x, o.y, o.z), Q.setFromEuler(E.set(0, o.ry || 0, 0)), S.set(1, o.sy || 1, 1)));
      if (o.color) m.setColorAt(i, o.color);
    });
    parent.add(m); return m;
  };
  // 模様は画像ファイルを使わず、その場で描く
  const paint = (w, h, draw) => {
    const cvs = document.createElement('canvas'); cvs.width = w; cvs.height = h;
    draw(cvs.getContext('2d'), w, h);
    const tex = new THREE.CanvasTexture(cvs); tex.colorSpace = THREE.SRGBColorSpace; tex.anisotropy = 4; return tex;
  };
  const veins = (g, x, y, w, h, color, n) => {                        // 大理石の筋
    g.save(); g.beginPath(); g.rect(x, y, w, h); g.clip(); g.strokeStyle = color; g.lineWidth = 1;
    for (let i = 0; i < n; i++) {
      let px = x + Math.random() * w, py = y + Math.random() * h;
      g.beginPath(); g.moveTo(px, py);
      for (let j = 0; j < 6; j++) { px += (Math.random() - 0.3) * 40; py += (Math.random() - 0.5) * 30; g.lineTo(px, py); }
      g.stroke();
    }
    g.restore();
  };
  const DIRS = [[0, -1], [1, 0], [0, 1], [-1, 0]];
  const eachCell = (f, fn) => { for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++) fn(PLANS[f][r][c], c, r); };
  const roomOf = (f, c, r) => { const ch = at(f, c, r); return ch === 'b' ? +at(f, c - 1, r) : isGallery(ch) ? +ch : -1; };
  // 壁に挟まれた通り抜けの 1 マス（出入口）。ここには絵も敷物も置かない
  const isDoor = (f, c, r) => {
    const n = at(f, c, r - 1) === '#', s = at(f, c, r + 1) === '#', e = at(f, c + 1, r) === '#', w = at(f, c - 1, r) === '#';
    return (n && s && !e && !w) || (e && w && !n && !s);
  };

        const g = r.fig.g, hx = g.position.x + Math.sin(g.rotation.y) * 0.75, hz = g.position.z + Math.cos(g.rotation.y) * 0.75;
        const open = (x, z) => cellAt(levelOf(g.position.y), x, z) !== '#';
        if (open(hx, hz)) { p.x = hx; p.z = hz; } else if (open(g.position.x, g.position.z)) { p.x = g.position.x; p.z = g.position.z; }
        hero.g.rotation.y = g.rotation.y + ix * 0.7; p.y = g.position.y + 0.9;      // 振った向きへ体をよじる（全員に見える） vy = 0; grounded = false;
      }
    }
    // 上下動：歩いているだけなら足元の面に沿う（階段を上り下りする）。足元が大きく下がれば落ち、跳べば上がる
    const floorY = supportAt(p.x, p.z, p.y);
    if (!heldBy && !stuck) {                                                         // 手が張りついている間は落ちない（壁にぶら下がる）
      if (grounded && vy <= 0 && p.y - floorY < 0.45) p.y = floorY;
      else { vy -= 14 * dt; p.y += vy * dt; grounded = p.y <= floorY; if (grounded) { p.y = floorY; vy = 0; } }
    }
    // 足元の状態を求め直す
    groundY = supportAt(p.x, p.z, p.y); air = Math.max(0, p.y - groundY);
    const under = rampAt(p.x, p.z);
    ramp = under && Math.abs(groundY - under.h) < 1e-6 ? under.k : null;
    lvl = Math.min(LEVELS - 1, Math.floor((groundY + 0.01) / H));
    shadow.position.y = 0.02 - air;                                                  // 影は足元の面に残す

    const breathe = Math.sin(clock.elapsedTime * 2.2);                              // 立っている間もゆっくり呼吸する
    const act = heldBy ? ACT.HELD : Math.hypot(kvx, kvz) > 1.5 ? ACT.OUCH : punchT > 0 ? punchKind : stuck === 'floor' ? ACT.FLOOR : holding || grabbing ? ACT.REACH : ACT.NONE;
    const reach = Math.sin((1 - punchT / PUNCH_TIME) * Math.PI);                     // パンチは突き出して戻す
    pose(hero, dt, moving, walkT, breathe, act, clock.elapsedTime, reach, air); copyPose(ghost, hero);
    hero.setLook(hp <= 0 ? 'down' : camoT > 0 ? 'camoSelf' : 'normal'); ghost.setLook(hp <= 0 ? 'down' : camoT > 0 ? 'camo' : 'normal');
    const big = powerT > 0 ? 1.2 : 1; hero.g.scale.setScalar(big); ghost.g.scale.set(big, -big, big);   // パワーアップ中は体が大きい
    $('hpFill').style.width = hp + '%';

    // 試合中：片方のチームが全滅したら、気づいた端末が勝敗を全員へ知らせる（開始直後は古い HP が残るので 2 秒待つ）
    if (room && match.on && (matchT += dt) > 2) {
      const alive = [0, 0]; if (hp > 0) alive[myTeam]++;
      for (const r of remotes.values()) if (r.hp > 0) alive[r.team]++;
      const winner = roomApi.decideWinner(alive);
      if (winner !== null) { match.on = false; roomApi.setMatch({ on: false, winner, n: nonce() }); }
    }

    // アイテム：効果の残り時間を減らす／触れたら取る／出す係（id が先頭の人）なら時々 1 つ出す
    powerT = Math.max(0, powerT - dt); speedT = Math.max(0, speedT - dt); camoT = Math.max(0, camoT - dt);
    const buffText = [[powerT, '💪'], [speedT, '⚡'], [camoT, '👻']].filter(b => b[0] > 0).map(b => `${b[1]}${Math.ceil(b[0])}`).join('　');
    if ($('buffs').textContent !== buffText) $('buffs').textContent = buffText;
    for (const [id, it] of drops) {
      it.sprite.position.set(it.x, it.l * H + 0.85 + Math.sin(clock.elapsedTime * 2.5 + it.x) * 0.12, it.z);
      it.sprite.visible = Math.abs(it.l * H - groundY) < H * 0.9;
      if (!it.taking && hp > 0 && ramp === null && it.l === lvl && air < 1.2 && Math.hypot(it.x - p.x, it.z - p.z) < 0.9) {
        it.taking = true;
        roomApi.takeItem(id).then(ok => { if (ok) gotItem(it.t); else it.taking = false; });
      }
    }
    if (room && roomApi.pickHost([roomMe, ...remotes.keys()]) === roomMe && (spawnT += dt) >= SPAWN_EVERY) {
      spawnT = 0;
      if (drops.size < MAX_ITEMS) spawnItem();
    }

    // 部屋にいる間：自分の位置を 1 秒に 10 回まで送り（動いたときだけ）、他の人を受け取った位置へなめらかに寄せる
    if (room) {
      sendT += dt;
      if (sendT >= 0.1) {
        sendT = 0;
        const s = [p.x, p.y, p.z, hero.g.rotation.y].map(v => Math.round(v * 100) / 100).concat(moving ? 1 : 0, act, hp, buffBits());
        if (s.join() !== lastSent) { lastSent = s.join(); roomApi.send(s); }
      }
    }
    for (const [id, r] of remotes) {
      const g = r.fig.g, [tx, ty, tz, tr, mv, ract] = r.target;
      if (id === holding) {                                                          // 自分が持っている相手は、通信を待たずに手元へ描く
        const [fx, fz] = facing();
        g.position.set(p.x + fx * 0.75, p.y + 0.9, p.z + fz * 0.75); g.rotation.y = hero.g.rotation.y;
      } else {
        const k = Math.hypot(tx - g.position.x, tz - g.position.z) > 6 ? 1 : 1 - Math.exp(-dt * 12);
        g.position.set(g.position.x + (tx - g.position.x) * k, g.position.y + (ty - g.position.y) * k, g.position.z + (tz - g.position.z) * k);
        g.rotation.y += Math.atan2(Math.sin(tr - g.rotation.y), Math.cos(tr - g.rotation.y)) * k;
      }
      if (mv) r.walkT += dt * 11;
      if (ract !== r.lastAct) { r.lastAct = ract; r.actT = 0; }                      // 動作が変わった瞬間からパンチの伸びを数える
      r.actT = (r.actT || 0) + dt;
      pose(r.fig, dt, !!mv, r.walkT, breathe, id === holding ? ACT.HELD : ract, clock.elapsedTime, isPunch(ract) ? Math.sin(Math.min(1, r.actT / PUNCH_TIME) * Math.PI) : 1,
        g.position.y - supportAt(g.position.x, g.position.z, g.position.y + 0.01));
      const hidden = (r.buffs & 4) && r.team !== myTeam && r.hp > 0;                  // 同化中の相手チームは名札も HP も出さない
      r.fig.setLook(r.hp <= 0 ? 'down' : r.buffs & 4 ? (r.team === myTeam ? 'camoSelf' : 'camo') : 'normal');
      g.scale.setScalar(r.buffs & 1 && r.hp > 0 ? 1.2 : 1); r.tag.visible = !hidden;
      r.bar.visible = match.on && r.hp > 0 && !hidden; r.bar.scale.set(Math.max(0.02, r.hp / 100), 0.07, 1);
      r.bar.material.color.set(r.hp > 50 ? 0x57e389 : r.hp > 25 ? 0xf5c211 : 0xe2485a);
      g.visible = Math.abs(ty - p.y) < H * 0.9;                                      // 違う階の人は描かない
    }

    // 見せる階の切り替え。床の映り込み（逆さまの絵とキャラ）は、その階の床に立っている間だけ出す
    const onFloor = ramp === null;
    for (let f = 0; f < LEVELS; f++) {
      const L = levels[f];
      L.visible = Math.abs(f - groundY / H) < 1;
      if (L.visible && L.userData.load) { L.userData.load.forEach(fn => fn()); L.userData.load = null; }
      mirrors[f].visible = onFloor && lvl === f;
      wallsG[f].visible = f >= Math.floor(groundY / H + 1e-4);                           // 足元より下の階の壁は隠す（床に映す像と重なるため）
    }
    ghost.g.visible = onFloor;
    ghost.g.position.set(p.x, 2 * lvl * H - p.y, p.z); ghost.g.rotation.y = hero.g.rotation.y;

    // 三人称カメラ（壁にめり込まないよう、壁の手前で止める）
    const sx = Math.sin(yaw), sz = Math.cos(yaw);
    let dist = 0;
    const camLevel = Math.round(groundY / H);
    while (dist < 4.6 && cellAt(camLevel, p.x + sx * (dist + 0.5), p.z + sz * (dist + 0.5)) !== '#') dist += 0.2;
    camY += (p.y - air * 0.5 - camY) * (1 - Math.exp(-dt * 10));                     // 落ちたときに視点が一気に飛ばないよう、高さはなめらかに追う
    camera.position.set(p.x + sx * dist, camY + 1.9, p.z + sz * dist);
    camera.lookAt(p.x, camY + 1.2, p.z);

    // いちばん近い絵の題名を出す
    let best = null, bestD = 2.8;
    if (onFloor) for (const a of arts) {
      if (a.lvl !== lvl) continue;
      const dd = Math.hypot(a.pos.x - p.x, a.pos.z - p.z); if (dd < bestD) { bestD = dd; best = a; }
    }
    if (best !== near) {
      near = best;
      $('caption').style.display = near ? 'flex' : 'none';
      if (near) $('capTitle').textContent = near.item.title || '無題';
    }
    drawMap(Math.round(groundY / H));
    renderer.render(scene, camera);
  };
  renderer.setAnimationLoop(frame);

  window.__museum = { get lvl() { return lvl; }, set lvl(v) { p.y = v * H; vy = 0; grounded = true; }, get ramp() { return ramp; }, set yaw(v) { yaw = v; }, get air() { return air; }, get act() { return { punchT, grabbing, stuck, holding, heldBy, kv: [kvx, kvz], hp, team: myTeam, match: match.on, down: hero.down, look: hero.look, buffs: buffBits(), items: [...drops.values()].map(i => [i.t, i.x, i.z, i.l]) }; }, gotItem, p, canBeAt, supportAt, jump, punch, grabStart, grabEnd, get punchKind() { return punchKind; }, knock(x, z) { kvx = x; kvz = z; }, get body() { return hero.pts.map(q => q.p.toArray().map(v => Math.round(v * 100) / 100)); }, tick: frame };   // 動作確認用
}
</script>
