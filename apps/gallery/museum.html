<script type="module">
import * as THREE from 'three';

const $ = id => document.getElementById(id);
const fail = text => { $('msgText').textContent = text; $('msg').style.display = 'flex'; };

/* 間取り（階ごとに違う）。どの階も、実在の美術館に多い「中央ホール＋大階段を展示室が囲む回遊型」。1 文字 = 2.5m 四方。
   # 壁 / 0〜9 展示室（数字は部屋番号。壁に挟まれた 1 マスは出入口） / b ベンチのある展示室マス（部屋は左隣と同じ）
   . 中央ホール / A 階段 1F⇔2F（西が下） / B 階段 2F⇔3F（東が下）。中央ホールと階段の位置は全階共通 */
const PLANS = [
  [ // 1F：8 室が一周する回廊。出入口を一直線に並べたエンフィラード
    '#################',
    '#000#1111111#222#',
    '#000#1b111b1#222#',
    '#000011111111222#',
    '##3#####.#####4##',
    '#333#.......#444#',
    '#333#.AAAAA.#444#',
    '#333.........444#',
    '#333#.BBBBB.#444#',
    '#333#.......#444#',
    '##3#####.#####4##',
    '#555566666666777#',
    '#555#6b666b6#777#',
    '#555#6666666#777#',
    '#################',
  ],
  [ // 2F：南北に建物の幅いっぱいの長い大展示室、東西に小部屋が 2 つずつ
    '#################',
    '#000000000000000#',
    '#00b000000000b00#',
    '#000000000000000#',
    '##0#####.#####0##',
    '#111#.......#333#',
    '#111#.AAAAA.#333#',
    '##1##.......##3##',
    '#222#.BBBBB.#444#',
    '#222#.......#444#',
    '##2#####.#####4##',
    '#555555555555555#',
    '#55b555555555b55#',
    '#555555555555555#',
    '#################',
  ],
  [ // 3F：東西に縦長の翼廊、北に広間、南に通路と小部屋 2 つ
    '#################',
    '#000#1111111#222#',
    '#0b0#1111111#2b2#',
    '#000011111111222#',
    '#000####.####222#',
    '#000#.......#222#',
    '#000#.AAAAA.#222#',
    '#000.........222#',
    '#000#.BBBBB.#222#',
    '#000#.......#222#',
    '#000####.####222#',
    '#000055555555222#',
    '#0b0#333#444#2b2#',
    '#000#333#444#222#',
    '#################',
  ],
];
const COLS = 17, ROWS = 15, LEVELS = 3;
const C = 2.5, H = 4.4, R = 0.35;                       // マス幅・階高・キャラの半径（m）
const cx = c => (c - 8) * C, cz = r => (r - 7) * C;     // マスの中心 → 座標
const at = (f, c, r) => PLANS[f]?.[r]?.[c] ?? '#';
const cellAt = (f, x, z) => at(f, Math.floor(x / C + 8.5), Math.floor(z / C + 7.5));
const isGallery = ch => (ch >= '0' && ch <= '9') || ch === 'b';
// 階段 k は k 階と k+1 階をつなぐ。x0 が下の端、x1 が上の端
const STAIRS = [
  { z: cz(6), x0: cx(6) - C / 2, x1: cx(10) + C / 2 },
  { z: cz(8), x0: cx(10) + C / 2, x1: cx(6) - C / 2 },
];
const stairOf = ch => 'AB'.indexOf(ch);
console.assert(PLANS.length === LEVELS && PLANS.every(p => p.length === ROWS && p.every(r => r.length === COLS)), '間取りの大きさが不正');
// 階段は上下の階で同じ位置に無いと上り下りできない。両端のマスも歩ける床であること
console.assert([0, 1].every(f => PLANS[f][6].slice(5, 12) === '.AAAAA.') && [1, 2].every(f => PLANS[f][8].slice(5, 12) === '.BBBBB.'), '階段の位置が階によってずれている');

// 展示データはギャラリーページ（index.html の loadGallery）が localStorage に保存したものを使う
const httpUrl = v => { try { const u = new URL(v); return /^https?:$/.test(u.protocol) ? u.href : ''; } catch (_) { return ''; } };
let items = [];
try { items = JSON.parse(localStorage.getItem('gallery_museum_items') || '[]'); } catch (_) {}
items = (Array.isArray(items) ? items : [])
  .map(i => ({ title: String(i?.title || ''), thumb: httpUrl(i?.thumb), full: httpUrl(i?.full) }))
  .filter(i => i.thumb);
// ?preview=1 では本番の画像に触れず、同梱のサンプルを飾る（ギャラリー本体のプレビューと同じ考え方）
if (new URLSearchParams(location.search).get('preview') === '1') {
  items = Array.from({ length: 24 }, (_, i) => {
    const url = new URL(`frames/f_${String(1 + i * 5).padStart(3, '0')}.jpg`, location.href).href;
    return { title: `表示確認用サンプル ${i + 1}`, thumb: url, full: url };
  });
}

if (!items.length) {
  fail('展示する作品がまだ読み込まれていません。先にギャラリーを開いてから、もう一度お入りください。');
} else {
  try { start(); } catch (e) { console.error(e); fail('この端末では3D表示を開始できませんでした。'); }
}

function start() {
  const renderer = new THREE.WebGLRenderer({ canvas: $('c'), antialias: true });
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0x0e0806);
  const camera = new THREE.PerspectiveCamera(60, 1, 0.1, 120);
  // 縦持ちのスマホ（タッチ端末で縦長）のときは .turned を付けて横向き表示にする。PC の縦長ウィンドウは回さない
  const stage = $('stage'), root = document.documentElement, portraitPhone = matchMedia('(orientation: portrait) and (pointer: coarse)');
  const turned = () => root.classList.contains('turned');
  const resize = () => { const w = stage.clientWidth, h = stage.clientHeight; renderer.setSize(w, h, false); camera.aspect = w / h; camera.updateProjectionMatrix(); };
  const applyTurn = () => { root.classList.toggle('turned', portraitPhone.matches); resize(); };
  portraitPhone.addEventListener('change', applyTurn); addEventListener('resize', resize); applyTurn();

  // 全体は暗めにして、絵ごとのスポットライト（壁の光だまり）を目立たせる
  scene.add(new THREE.HemisphereLight(0xfff1dc, 0x6a5a50, 1.9));
  const sun = new THREE.DirectionalLight(0xffffff, 0.7); sun.position.set(3, 8, 5); scene.add(sun);

  const std = (color, roughness = 0.9) => new THREE.MeshStandardMaterial({ color, roughness });
  const M4 = new THREE.Matrix4(), Q = new THREE.Quaternion(), V = new THREE.Vector3(), S = new THREE.Vector3(), E = new THREE.Euler();
  // たくさん並ぶ同じ形はまとめて描く（list: [{x,y,z, ry?, sy?}]）
  const instanced = (geo, material, list, parent = scene) => {
    const m = new THREE.InstancedMesh(geo, material, list.length);
    list.forEach((o, i) => {
      m.setMatrixAt(i, M4.compose(V.set(o.x, o.y, o.z), Q.setFromEuler(E.set(0, o.ry || 0, 0)), S.set(1, o.sy || 1, 1)));
      if (o.color) m.setColorAt(i, o.color);
    });
    parent.add(m); return m;
  };
  // 模様は画像ファイルを使わず、その場で描く
  const paint = (w, h, draw) => {
    const cvs = document.createElement('canvas'); cvs.width = w; cvs.height = h;
    draw(cvs.getContext('2d'), w, h);
    const tex = new THREE.CanvasTexture(cvs); tex.colorSpace = THREE.SRGBColorSpace; tex.anisotropy = 4; return tex;
  };
  const veins = (g, x, y, w, h, color, n) => {                        // 大理石の筋
    g.save(); g.beginPath(); g.rect(x, y, w, h); g.clip(); g.strokeStyle = color; g.lineWidth = 1;
    for (let i = 0; i < n; i++) {
      let px = x + Math.random() * w, py = y + Math.random() * h;
      g.beginPath(); g.moveTo(px, py);
      for (let j = 0; j < 6; j++) { px += (Math.random() - 0.3) * 40; py += (Math.random() - 0.5) * 30; g.lineTo(px, py); }
      g.stroke();
    }
    g.restore();
  };
  const DIRS = [[0, -1], [1, 0], [0, 1], [-1, 0]];
  const eachCell = (f, fn) => { for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++) fn(PLANS[f][r][c], c, r); };
  const roomOf = (f, c, r) => { const ch = at(f, c, r); return ch === 'b' ? +at(f, c - 1, r) : isGallery(ch) ? +ch : -1; };
  // 壁に挟まれた通り抜けの 1 マス（出入口）。ここには絵も敷物も置かない
  const isDoor = (f, c, r) => {
    const n = at(f, c, r - 1) === '#', s = at(f, c, r + 1) === '#', e = at(f, c + 1, r) === '#', w = at(f, c - 1, r) === '#';
    return (n && s && !e && !w) || (e && w && !n && !s);
  };

  // 階ごとのまとまり。wallsG＝壁、levels＝絵・壁の化粧板・調度、mirrors＝床に映す逆さまの像
  const wallsG = [], levels = [], mirrors = [];
  for (let f = 0; f < LEVELS; f++) {
    const W = new THREE.Group(), L = new THREE.Group(), Mi = new THREE.Group();
    L.visible = Mi.visible = false; scene.add(W, L, Mi); wallsG.push(W); levels.push(L); mirrors.push(Mi);
  }

  // ── 建物 ──
  // 壁：通れるマスに接している壁マスだけ箱を置く。同じ壁を床の下にも逆さに置き、床への映り込みにする
  // （間取りが階ごとに違うので、下の階の壁は、その階より上にいる間は隠す）
  const wallGeo = new THREE.BoxGeometry(C, H, C), wallMat = std(0xe9e0d2);
  for (let f = 0; f < LEVELS; f++) {
    const up = [], down = [];
    eachCell(f, (ch, c, r) => {
      if (ch !== '#') return;
      for (let dr = -1; dr <= 1; dr++) for (let dc = -1; dc <= 1; dc++) {
        if (at(f, c + dc, r + dr) !== '#') { up.push({ x: cx(c), y: f * H + H / 2, z: cz(r) }); down.push({ x: cx(c), y: f * H - H / 2, z: cz(r) }); return; }
      }
    });
    instanced(wallGeo, wallMat, up, wallsG[f]); instanced(wallGeo, wallMat, down, mirrors[f]);
  }

  // 床：磨いた石。少し透けさせて、下に置いた「逆さまの絵」を映り込みに見せる。階段の吹き抜けは開ける
  const floorGeo = new THREE.PlaneGeometry(C, C).rotateX(-Math.PI / 2);
  const ceilGeo = new THREE.PlaneGeometry(C, C).rotateX(Math.PI / 2);
  // 柄は部屋番号と階から決める
  const isHall = ch => ch === '.' || stairOf(ch) >= 0;
  const pick = arr => arr[Math.floor(Math.random() * arr.length)];
  // 床の柄 4 種：大理石の市松／寄木／斜め格子の大理石／テラゾー
  const floorMats = [
    (g) => {
      for (let i = 0; i < 4; i++) {
        const x = (i % 2) * 128, y = (i >> 1) * 128, dark = (i % 2) ^ (i >> 1);
        g.fillStyle = dark ? '#34302c' : '#cfc4b2'; g.fillRect(x, y, 128, 128);
        veins(g, x, y, 128, 128, dark ? 'rgba(255,255,255,0.16)' : 'rgba(90,70,50,0.22)', 5);
      }
      g.strokeStyle = '#b8964a'; g.lineWidth = 3; g.strokeRect(0, 0, 256, 256); g.strokeRect(0, 0, 128, 128); g.strokeRect(128, 128, 128, 128);
    },
    (g) => {                                                          // 寄木（細い板を縦横交互に組む）
      for (let i = 0; i < 16; i++) for (let k = 0; k < 4; k++) {
        const x = (i % 4) * 64, y = (i >> 2) * 64, across = ((i % 4) + (i >> 2)) % 2;
        g.fillStyle = pick(['#8f6238', '#7d5430', '#9c6e42', '#86592f', '#a37848']);
        g.fillRect(across ? x : x + k * 16, across ? y + k * 16 : y, across ? 64 : 16, across ? 16 : 64);
        g.strokeStyle = 'rgba(40,22,10,0.55)'; g.lineWidth = 1;
        g.strokeRect(across ? x : x + k * 16, across ? y + k * 16 : y, across ? 64 : 16, across ? 16 : 64);
      }
    },
    (g) => {                                                          // 生成りの大理石に真鍮の斜め格子、交点に墨色の菱
      g.fillStyle = '#d8cdbb'; g.fillRect(0, 0, 256, 256); veins(g, 0, 0, 256, 256, 'rgba(90,70,50,0.2)', 14);
      g.strokeStyle = 'rgba(160,125,60,0.75)'; g.lineWidth = 2;
      for (let d = -256; d <= 512; d += 64) { g.beginPath(); g.moveTo(d, 0); g.lineTo(d + 256, 256); g.moveTo(d, 0); g.lineTo(d - 256, 256); g.stroke(); }
      g.fillStyle = '#2f2b28';
      for (let y = 0; y <= 256; y += 32) for (let x = (y / 32) % 2 ? 32 : 0; x <= 256; x += 64) {
        g.beginPath(); g.moveTo(x, y - 9); g.lineTo(x + 9, y); g.lineTo(x, y + 9); g.lineTo(x - 9, y); g.fill();
      }
    },
    (g) => {                                                          // テラゾー（色石のかけらを散らした研ぎ出し）
      g.fillStyle = '#bdb4a6'; g.fillRect(0, 0, 256, 256);
      for (let i = 0; i < 380; i++) {
        g.fillStyle = pick(['#7d2e35', '#2f4f4a', '#efe6d6', '#34425e', '#c9a44a', '#3a3632', '#efe6d6']);
        g.beginPath(); g.ellipse(Math.random() * 256, Math.random() * 256, 2 + Math.random() * 6, 1.5 + Math.random() * 4, Math.random() * 3, 0, 7); g.fill();
      }
      g.strokeStyle = '#b8964a'; g.lineWidth = 3; g.strokeRect(0, 0, 256, 256);
    },
  ].map(draw => new THREE.MeshStandardMaterial({ roughness: 0.25, transparent: true, opacity: 0.82, map: paint(256, 256, draw) }));
  const floorMat = floorMats[0];
  // 天井は格天井。展示室は生成りに金の縁、ホールは群青に金の星
  const coffer = (bg, inner, line, stars) => new THREE.MeshStandardMaterial({ roughness: 0.9, map: paint(256, 256, (g) => {
    g.fillStyle = bg; g.fillRect(0, 0, 256, 256);
    for (let i = 0; i < 4; i++) {
      const x = (i % 2) * 128 + 14, y = (i >> 1) * 128 + 14;
      const gr = g.createLinearGradient(x, y, x + 100, y + 100); gr.addColorStop(0, inner[0]); gr.addColorStop(1, inner[1]);
      g.fillStyle = gr; g.fillRect(x, y, 100, 100);
      g.strokeStyle = line; g.lineWidth = 3; g.strokeRect(x, y, 100, 100); g.lineWidth = 1; g.strokeRect(x + 9, y + 9, 82, 82);
      g.fillStyle = line;
      if (stars) for (let s = 0; s < 7; s++) { g.beginPath(); g.arc(x + 14 + Math.random() * 72, y + 14 + Math.random() * 72, 0.8 + Math.random() * 1.6, 0, 7); g.fill(); }
      else { g.beginPath(); g.arc(x + 50, y + 50, 7, 0, 7); g.fill(); }
    }
  }) });
  const ceilMat = coffer('#efe8da', ['#d6ccba', '#e6ddcc'], '#c2a45a', false);
  const ceilMats = [ceilMat, coffer('#3a2a1e', ['#4a3626', '#5c4532'], '#c9a44a', false), coffer('#dfe6e8', ['#c3d0d6', '#d6e0e4'], '#ffffff', false)];   // 生成り／胡桃色の木／淡い青灰
  const hallCeilMat = coffer('#141c36', ['#1b2750', '#27376e'], '#e2c46a', true);
  for (let f = 0; f < LEVELS; f++) {
    const fl = floorMats.map(() => []), ce = ceilMats.map(() => []), ceHall = [];
    eachCell(f, (ch, c, r) => {
      if (ch === '#') return;
      const k = stairOf(ch), hall = isHall(ch), room = roomOf(f, c, r);
      if (k < 0 || f !== k + 1) fl[hall ? 0 : (room + f) % 4].push({ x: cx(c), y: f * H, z: cz(r) });
      if (k < 0 || f !== k) (hall ? ceHall : ce[(room + 2 * f) % 3]).push({ x: cx(c), y: (f + 1) * H - 0.02, z: cz(r) });
    });
    fl.forEach((list, i) => { if (list.length) instanced(floorGeo, floorMats[i], list).renderOrder = f * 10 + 5; });   // 下の階の床から順に描く
    ce.forEach((list, i) => { if (list.length) instanced(ceilGeo, ceilMats[i], list); });
    instanced(ceilGeo, hallCeilMat, ceHall);
  }
  const under = new THREE.Mesh(new THREE.PlaneGeometry(COLS * C, ROWS * C).rotateX(-Math.PI / 2), ceilMat);
  under.position.y = -H + 0.02; scene.add(under);                     // 1 階の床に映る「天井」

  // 調度：ホールの赤絨毯、展示室の敷物、鑑賞用ベンチ。床より少し上に置く（敷いた所は映り込まない）
  const carpet = [];
  // 敷物 3 種：臙脂に金の縁／紺に円い紋／深緑に菱つなぎ
  const rugMats = [['#4a1420', '#5e1b2a', '#c9a44a', 0], ['#141c36', '#1f2c58', '#e6dcc6', 1], ['#123329', '#1b4a3b', '#c9a44a', 2]].map(([edge, field, line, kind]) =>
    new THREE.MeshStandardMaterial({ roughness: 1, map: paint(256, 256, (g) => {
      g.fillStyle = edge; g.fillRect(0, 0, 256, 256);
      g.strokeStyle = line; g.lineWidth = 6; g.strokeRect(12, 12, 232, 232); g.lineWidth = 2; g.strokeRect(26, 26, 204, 204);
      g.fillStyle = field; g.fillRect(34, 34, 188, 188);

    const dt = Math.min(clock.getDelta(), 0.05);
    if (window.WOS_PANEL_ACTIVE === false) return;                                   // ポータルで他のメニューを見ている間は描画を止める
    let ix = stickV.x + (keys.KeyD || keys.ArrowRight ? 1 : 0) - (keys.KeyA || keys.ArrowLeft ? 1 : 0);
    let iy = stickV.y + (keys.KeyW || keys.ArrowUp ? 1 : 0) - (keys.KeyS || keys.ArrowDown ? 1 : 0);
    const len = Math.hypot(ix, iy); if (len > 1) { ix /= len; iy /= len; }
    const moving = len > 0.05 && viewer.style.display !== 'flex';
    if (moving) {
      // カメラの向きを基準に前後左右へ動く
      const vx = -Math.sin(yaw) * iy + Math.cos(yaw) * ix, vz = -Math.cos(yaw) * iy - Math.sin(yaw) * ix;
      const mx = vx * 4 * dt, mz = vz * 4 * dt;
      if (ramp === null) {
        if (free(p.x + mx, p.z)) p.x += mx;                                           // 壁に当たったら壁沿いに滑る
        if (free(p.x, p.z + mz)) p.z += mz;
        const k = stairOf(cellAt(lvl, p.x, p.z));
        if (k >= 0 && (lvl === k || lvl === k + 1)) ramp = k;
      } else {
        const s = STAIRS[ramp];
        p.x += mx; p.z = clamp(p.z + mz, s.z - (C / 2 - R), s.z + (C / 2 - R));
        const t = (p.x - s.x0) / (s.x1 - s.x0);
        if (t <= 0) { lvl = ramp; ramp = null; } else if (t >= 1) { lvl = ramp + 1; ramp = null; }
        p.y = (ramp === null ? lvl : ramp + t) * H;
      }
      let d = Math.atan2(vx, vz) - hero.g.rotation.y;                                // 進行方向へ最短で振り向く
      d = Math.atan2(Math.sin(d), Math.cos(d));
      hero.g.rotation.y += d * Math.min(1, dt * 12);
      walkT += dt * 11 * Math.min(1, len);
    }
    const swing = moving ? Math.sin(walkT) : 0;
    const breathe = Math.sin(clock.elapsedTime * 2.2);                              // 立っている間もゆっくり呼吸する
    for (const fig of [hero, ghost]) {
      fig.arms[0].rotation.x = swing * 1.1; fig.arms[1].rotation.x = -swing * 1.1;  // 腕は大きくぱたぱた振る
      fig.legs[0].rotation.x = -swing * 0.9; fig.legs[1].rotation.x = swing * 0.9;
      fig.b.position.y = moving ? Math.abs(swing) * 0.07 : breathe * 0.012;         // ぴょこぴょこ弾む
      fig.b.rotation.z = swing * 0.07;                                              // 体を左右に揺らす
      fig.head.position.y = 1.2 + (moving ? Math.abs(Math.cos(walkT)) * 0.03 : breathe * 0.01);
    }

    // 見せる階の切り替え。床の映り込み（逆さまの絵とキャラ）は、その階の床に立っている間だけ出す
    const onFloor = ramp === null;
    for (let f = 0; f < LEVELS; f++) {
      const L = levels[f];
      L.visible = Math.abs(f - p.y / H) < 1;
      if (L.visible && L.userData.load) { L.userData.load.forEach(fn => fn()); L.userData.load = null; }
      mirrors[f].visible = onFloor && lvl === f;
      wallsG[f].visible = f >= Math.floor(p.y / H + 1e-4);                           // 足元より下の階の壁は隠す（床に映す像と重なるため）
    }
    ghost.g.visible = onFloor;
    ghost.g.position.set(p.x, lvl * H, p.z); ghost.g.rotation.y = hero.g.rotation.y;

    // 三人称カメラ（壁にめり込まないよう、壁の手前で止める）
    const sx = Math.sin(yaw), sz = Math.cos(yaw);
    let dist = 0;
    const camLevel = Math.round(p.y / H);
    while (dist < 4.6 && cellAt(camLevel, p.x + sx * (dist + 0.5), p.z + sz * (dist + 0.5)) !== '#') dist += 0.2;
    camera.position.set(p.x + sx * dist, p.y + 1.9, p.z + sz * dist);
    camera.lookAt(p.x, p.y + 1.2, p.z);

    // いちばん近い絵の題名を出す
    let best = null, bestD = 2.8;
    if (onFloor) for (const a of arts) {
      if (a.lvl !== lvl) continue;
      const dd = Math.hypot(a.pos.x - p.x, a.pos.z - p.z); if (dd < bestD) { bestD = dd; best = a; }
    }
    if (best !== near) {
      near = best;
      $('caption').style.display = near ? 'flex' : 'none';
      if (near) $('capTitle').textContent = near.item.title || '無題';
    }
    drawMap(Math.round(p.y / H));
    renderer.render(scene, camera);
  });

  window.__museum = { get lvl() { return lvl; }, set lvl(v) { lvl = v; ramp = null; p.y = v * H; }, get ramp() { return ramp; }, set yaw(v) { yaw = v; }, p, free };   // 動作確認用
}
</script>
</body>
