<script type="module">
/* もふもふ冒険：白くて丸いキャラで、空に浮かぶステージを進む協力アクション（3 人まで）。
   足場・仕掛け・キャラの動きのルールは adventure-world.js。このファイルは、それを描く・操作する・部屋でそろえる係。
   キャラの体（ラグドール）は美術館 museum.html と同じ作り。
   shortcut: 体の作りと部屋の画面は museum.html から写してある（あちらは 1 つの関数の中にあり、そのままは読み込めない）。3 つ目の遊びを作るときは共通の部品に切り出す */
import * as THREE from 'three';
import { STAGES, makeWorld, makePlayer } from './adventure-world.js?v=4.00';

const $ = id => document.getElementById(id);
try { start(); } catch (e) { console.error(e); $('msgText').textContent = 'この端末では3D表示を開始できませんでした。'; $('msg').style.display = 'flex'; }

function start() {
  const renderer = new THREE.WebGLRenderer({ canvas: $('c'), antialias: true });
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(60, 1, 0.1, 400);
  // 縦持ちのスマホ（タッチ端末で縦長）のときは .turned を付けて横向き表示にする。PC の縦長ウィンドウは回さない
  const stage = $('stage'), root = document.documentElement, portraitPhone = matchMedia('(orientation: portrait) and (pointer: coarse)');
  const turned = () => root.classList.contains('turned');
  const resize = () => { const w = stage.clientWidth, h = stage.clientHeight; renderer.setSize(w, h, false); camera.aspect = w / h; camera.updateProjectionMatrix(); };
  const applyTurn = () => { root.classList.toggle('turned', portraitPhone.matches); resize(); };
  portraitPhone.addEventListener('change', applyTurn); addEventListener('resize', resize); applyTurn();

  scene.add(new THREE.HemisphereLight(0xffffff, 0x8a7a66, 2.1));
  const sun = new THREE.DirectionalLight(0xffffff, 1.1); sun.position.set(4, 10, -3); scene.add(sun);
  const std = (color, roughness = 0.9) => new THREE.MeshStandardMaterial({ color, roughness });
  const M4 = new THREE.Matrix4(), Q = new THREE.Quaternion(), E = new THREE.Euler();
  const paint = (w, h, draw) => {                                                     // 模様は画像ファイルを使わず、その場で描く
    const cvs = document.createElement('canvas'); cvs.width = w; cvs.height = h;
    draw(cvs.getContext('2d'), w, h);
    const tex = new THREE.CanvasTexture(cvs); tex.colorSpace = THREE.SRGBColorSpace; return tex;
  };

  // ── ステージの見た目 ──
  // 足場の色（adventure-world.js の色番号順）：草の島（土色。上に草を敷く）／石／木／動く床／門
  //   氷／トランポリン／ベルトコンベア（模様は下で流す）／（空き）／くずれる床
  //   のこぎり（赤く光る）／くずれる床／大砲台
  const MATS = [0x9b7653, 0xc9c2b4, 0xc49a62, 0xf2c94c, 0xd9534f, 0xc8efff, 0xff7eb6, 0x4a4f57, 0xe01f3d, 0xd8c7a0, 0xff8a1f].map(c => std(c));
  MATS[8].emissive.set(0x7a0010); MATS[8].metalness = 0.6; MATS[8].roughness = 0.3;
  const warpMat = new THREE.MeshBasicMaterial({ color: 0xa35cff }), warpGlow = new THREE.MeshBasicMaterial({ color: 0xd9b8ff, transparent: true, opacity: 0.35, depthWrite: false });
  MATS[5].roughness = 0.12;
  const windMat = new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.16, depthWrite: false });
  const beltTex = paint(64, 64, g => {                                                // ベルトの矢印（流れる向きへ動かす）
    g.fillStyle = '#4a4f57'; g.fillRect(0, 0, 64, 64); g.strokeStyle = '#f2c94c'; g.lineWidth = 7;
    g.beginPath(); g.moveTo(10, 44); g.lineTo(32, 20); g.lineTo(54, 44); g.stroke();
  });
  beltTex.wrapS = beltTex.wrapT = THREE.RepeatWrapping;
  const grassMat = std(0x7ecb5c), padMat = std(0xf5c211, 0.6), padOnMat = std(0x57e389, 0.6), poleMat = std(0xffffff, 0.6);
  const flagMat = std(0xb8b8b8, 0.8), flagOnMat = std(0xffb400, 0.8), cloudMat = new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.85 });
  const goalMat = new THREE.MeshBasicMaterial({ color: 0xfff27a });
  const crateMats = ['#c9965a', '#8d6a4a'].map(base => new THREE.MeshStandardMaterial({ roughness: 0.9, map: paint(128, 128, g => {   // 木箱（軽い／重い）
    g.fillStyle = base; g.fillRect(0, 0, 128, 128);
    g.strokeStyle = 'rgba(60,35,15,0.75)'; g.lineWidth = 10; g.strokeRect(5, 5, 118, 118);
    g.lineWidth = 8; g.beginPath(); g.moveTo(8, 8); g.lineTo(120, 120); g.moveTo(120, 8); g.lineTo(8, 120); g.stroke();
  }) }));
  const unit = new THREE.BoxGeometry(1, 1, 1);
  const boxMesh = (b, material, parent) => {                                          // 箱 b の形に合わせた直方体
    const m = new THREE.Mesh(unit, material); parent.add(m);
    m.userData.fit = () => { m.scale.set(b.x1 - b.x0, b.y1 - b.y0, b.z1 - b.z0); m.position.set((b.x0 + b.x1) / 2, (b.y0 + b.y1) / 2, (b.z0 + b.z1) / 2); };
    m.userData.fit(); return m;
  };

  let world, me, group, stageIndex = -1, run = 0, moving = [], pads = [], flags = [], belts = [], gusts = [];
  let bannerTimer, hintTimer;
  function banner(text, ms) { $('banner').textContent = text; $('banner').hidden = false; clearTimeout(bannerTimer); bannerTimer = setTimeout(() => { $('banner').hidden = true; }, ms); }
  function hint(text) { $('hint').textContent = text; $('hint').hidden = false; clearTimeout(hintTimer); hintTimer = setTimeout(() => { $('hint').hidden = true; }, 9000); }

  // ステージ i を最初から始める（n は「何回目の出発か」の通し番号。部屋では全員同じ値になる）
  function loadStage(i, n) {
    if (group) { scene.remove(group); group.traverse(o => { if (o.geometry && o.geometry !== unit) o.geometry.dispose(); }); }
    const st = STAGES[i]; stageIndex = i; run = n; holding = heldBy = null; grabbing = false;
    world = makeWorld(st); me = makePlayer(world); group = new THREE.Group(); scene.add(group); moving = []; pads = []; flags = [];
    scene.background = paint(2, 256, g => { const k = g.createLinearGradient(0, 0, 0, 256); k.addColorStop(0, st.sky[0]); k.addColorStop(1, st.sky[1]); g.fillStyle = k; g.fillRect(0, 0, 2, 256); });
    scene.fog = new THREE.Fog(st.sky[1], 60, 260);
    for (const b of st.boxes) {
      boxMesh(b, MATS[b.c], group);
      if (b.c === 0) boxMesh({ x0: b.x0 - 0.06, x1: b.x1 + 0.06, y0: b.y1 - 0.25, y1: b.y1 + 0.01, z0: b.z0 - 0.06, z1: b.z1 + 0.06 }, grassMat, group);
    }
    belts = [];
    for (const b of st.boxes) if (b.belt) {                                           // ベルトの上面に、流れる矢印を重ねる
      const w = b.x1 - b.x0, d = b.z1 - b.z0, tex = beltTex.clone(); tex.repeat.set(w / 2, d / 2); tex.needsUpdate = true;
      const top = new THREE.Mesh(new THREE.PlaneGeometry(w, d).rotateX(-Math.PI / 2), new THREE.MeshStandardMaterial({ map: tex, roughness: 0.8 }));
      // 矢印の先は、そのままだと北の逆（-z）を向く。流れる向きへ回す
      // shortcut: 前後（z 方向）に流れるベルトだけを想定。横向きのベルトを作るときは、板の縦横も入れ替える
      top.rotation.y = Math.atan2(-b.belt[0], -b.belt[1]);
      top.position.set((b.x0 + b.x1) / 2, b.y1 + 0.01, (b.z0 + b.z1) / 2); group.add(top); belts.push({ tex, speed: Math.hypot(...b.belt) });
    }
    gusts = world.winds.map(k => {                                                    // 風の通り道（吹いている間だけ見える）
      const m = boxMesh(k, windMat, group); m.userData.wind = k; return m;
    });
    for (const m of world.movers) { const mesh = boxMesh(m.box, MATS[m.b.c], group); mesh.userData.m = m; moving.push(mesh); }
    for (const c of world.crates) moving.push(boxMesh(c.box, crateMats[+!!c.heavy], group));
    for (const k of world.warps) {                                                    // ワープ台：むらさきの円盤と、立ちのぼる光
      const disc = new THREE.Mesh(new THREE.CylinderGeometry(0.8, 0.8, 0.08, 28), warpMat); disc.position.set(k.x, k.y + 0.04, k.z); group.add(disc);
      const beam = new THREE.Mesh(new THREE.CylinderGeometry(0.7, 0.7, 2.4, 20, 1, true), warpGlow); beam.position.set(k.x, k.y + 1.2, k.z); group.add(beam);
    }
    for (const p of world.plates) {
      const m = new THREE.Mesh(new THREE.CylinderGeometry(p.w / 2, p.w / 2, 0.12, 24), padMat); m.position.set(p.x, p.y + 0.06, p.z); group.add(m); pads.push(m);
    }
    st.cps.forEach((c, k) => {                                                        // セーブ地点の旗（通ると金色になる）
      const pole = new THREE.Mesh(new THREE.CylinderGeometry(0.04, 0.04, 2.2, 8), poleMat); pole.position.set(c.x - 2.4, c.y + 1.1, c.z); group.add(pole);
      const flag = new THREE.Mesh(new THREE.BoxGeometry(0.7, 0.45, 0.03), k ? flagMat : flagOnMat); flag.position.set(c.x - 2.02, c.y + 1.95, c.z); group.add(flag); flags.push(flag);
    });
    const ring = new THREE.Mesh(new THREE.TorusGeometry(1.2, 0.12, 10, 40), goalMat); ring.position.set(st.goal.x, st.goal.y + 1.5, st.goal.z); group.add(ring);
    group.userData.ring = ring;
    for (let k = 0; k < 26; k++) {                                                    // 雲（足場の下と周りに散らす。場所はステージごとに決まっている）
      const r = a => { const v = Math.sin((k + 1) * a + i * 7.3) * 43758.5; return v - Math.floor(v); };
      const cloud = new THREE.Mesh(new THREE.SphereGeometry(1, 12, 8), cloudMat);
      cloud.position.set((r(12.9) - 0.5) * 90, -9 - r(78.2) * 14 + (k % 5 ? 0 : 26), r(39.3) * 110 - 15); cloud.scale.set(5 + r(4.1) * 7, 1.2 + r(9.7), 3 + r(2.3) * 5); group.add(cloud);
    }
    $('stageInfo').textContent = `🗺 ${i + 1}/${STAGES.length}　${st.name}`;
    banner(`ステージ ${i + 1}　${st.name}`, 2500); hint(st.cps[0].hint);
    hero.pts = null;                                                                  // 体も新しい場所から作り直す
  }

  // ── 白くて丸いキャラ（ローカル +z が前）──
  /* 体はラグドール：9 個の粒（左肩・右肩・左股・右股・頭・左手・右手・左足・右足）を、長さの変わらない棒でつないだもの。
     粒には重力がかかり、足場に当たる。pose が決める「目標の姿勢」へは、ばねで引かれるだけ（力の入れ具合は動作ごとに変える）。
     shortcut: 粒が当たるのは足場の上面だけ。壁や他の人にはめり込む。体の位置そのもの（当たり判定・通信）は 1 点で持つ */
  const white = std(0xffffff, 0.55);
  const ARM = 0.34, LEG = 0.24;
  const REST = [[-0.2, 0.84, 0], [0.2, 0.84, 0], [-0.12, 0.36, 0], [0.12, 0.36, 0], [0, 1.2, 0]].map(a => new THREE.Vector3(...a));
  const RADIUS = [0.2, 0.2, 0.2, 0.2, 0.31, 0.078, 0.078, 0.1, 0.1];
  const LINKS = [[0, 5, ARM], [1, 6, ARM], [2, 7, LEG], [3, 8, LEG]];
  for (let i = 0; i < 5; i++) for (let j = 0; j < i; j++) LINKS.push([j, i, REST[i].distanceTo(REST[j])]);   // 胴と頭は、すべての組をつないで形を保つ
  const DOWN = new THREE.Vector3(0, -1, 0), QB = new THREE.Quaternion(), VA = new THREE.Vector3(), VB = new THREE.Vector3(), VC = new THREE.Vector3();
  function makeFigure() {
    const g = new THREE.Group(), b = new THREE.Group(); g.add(b);
    const torso = new THREE.Mesh(new THREE.CapsuleGeometry(0.24, 0.16, 8, 20), white); torso.position.y = 0.06; b.add(torso);
    const head = new THREE.Mesh(new THREE.SphereGeometry(0.31, 32, 24), white); g.add(head);
    const limb = (len, rad) => {                                                      // 付け根の丸みを胴の中へ埋める：どう振っても胴とつながって見える
      const pivot = new THREE.Group(), o = new THREE.Mesh(new THREE.CapsuleGeometry(rad, len, 8, 16), white);
      o.position.y = -len / 2; pivot.add(o); g.add(pivot); return pivot;
    };
    scene.add(g);
    return { g, parts: [b, head, limb(ARM, 0.078), limb(ARM, 0.078), limb(LEG, 0.1), limb(LEG, 0.1)] };
  }
  const ACT = { NONE: 0, REACH: 2, HELD: 3, HANG: 4, FALL: 5, OUCH: 6 };              // 他の人へ伝える見た目の動作
  /* 姿勢：まず「目標の姿勢」を決め、粒をそこへばねで寄せる。腕・脚の角度は負が前。airborne は足が地面についていない間。
     ばねはかなり弱い：自分で立っていられないくらい脱力していて、頭は垂れ、腕はほぼ重力まかせ、止まっていてもふらつく */
  function pose(fig, dt, moving, t, breathe, act, time, airborne) {
    const s = moving ? Math.sin(t) : 0, w = Math.sin(time * 9), sway = Math.sin(time * 0.9) + Math.sin(time * 2.3) * 0.5;
    // ふだん：腕をだらんと垂らし、大きく前のめりで左右によたよた歩く
    let aL = moving ? -0.2 + s * 0.5 : sway * 0.1, aR = moving ? -0.2 - s * 0.5 : -sway * 0.1;     // 腕の前後
    let oL = 0.25 + Math.abs(s) * 0.3, oR = oL;                                                    // 腕の開き
    let lL = -s * 0.75, lR = s * 0.75;                                                             // 脚の前後
    let bx = moving ? 0.38 : 0.08 + sway * 0.05, by = s * 0.35, bz = moving ? s * 0.38 : sway * 0.14;   // 体の前傾・ひねり・横揺れ

      for (const o of world.crates) if (o.held === id && o !== c) {                    // 放した（置き場所は、放した人からの知らせで決まる）
        o.held = null;
        if (o.pending) { [o.x, o.y, o.z] = o.pending; o.pending = null; o.vy = 0; world.fit(o); }
      }
      if (c && !c.heavy && me.carry === c && id < roomMe) { me.carry = null; c.held = null; }   // 同じ箱を同時につかんだら、id が先の人のもの
      if (c && !c.heavy && (c.held === id || !c.held)) { c.held = id; c.x = g.position.x + Math.sin(g.rotation.y) * 0.75; c.y = g.position.y + 0.55; c.z = g.position.z + Math.cos(g.rotation.y) * 0.75; world.fit(c); }
    }

    // 仲間の体も足場・壁になる：ぶつかるし、頭の上に乗れる（肩車で高い所へ届く）。持ち上げている・持ち上げられている相手とは当たらない
    world.extra = [];
    for (const [id, r] of remotes) {
      if (id === holding || id === heldBy || r.target[5] === ACT.HELD) continue;
      const q = r.fig.g.position;
      world.extra.push({ x0: q.x - 0.25, x1: q.x + 0.25, z0: q.z - 0.25, z1: q.z + 0.25, y0: q.y, y1: q.y + 1.3, friend: true });
    }
    // 世界を 1 コマ進める（ふみ板を押すのは全員の足と箱。持ち上げられている人は押さない）
    const bodies = [[me.x, me.y, me.z]]; for (const r of remotes.values()) { const q = r.fig.g.position; bodies.push([q.x, q.y, q.z]); }
    world.step(dt, room ? roomApi.serverNow() : Date.now(), bodies);                 // 部屋ではサーバーの時計を使う（端末の時計がずれていても、動く床が全員で同じ位置になる）

    // 持ち上げている側：仲間がいなくなる・抜けたら放す／持ち上げられている側：相手の手元へ運ばれ、スティックを振ると抜ける
    if (holding) { holdT += dt; const r = remotes.get(holding); if (!r || (holdT > 0.8 && r.target[5] !== ACT.HELD)) release('drop'); }
    if (heldBy) {
      const r = remotes.get(heldBy);
      if (!r || (struggle += Math.abs(ix - lastIx)) > 6) { heldBy = null; me.frozen = false; me.vy = 3; me.grounded = false; }
      else { const g = r.fig.g; me.x = g.position.x + Math.sin(g.rotation.y) * 0.75; me.z = g.position.z + Math.cos(g.rotation.y) * 0.75; me.y = g.position.y + 0.9; me.ry = g.rotation.y + ix * 0.7; me.air = 0.9; }
    }
    lastIx = ix;
    // カメラの向きを基準に前後左右へ動く
    me.step(dt, -Math.sin(yaw) * iy + Math.cos(yaw) * ix, -Math.cos(yaw) * iy - Math.sin(yaw) * ix, dragMode());
    if (me.carry) world.fit(me.carry);                                               // 持っている箱の見た目を手元へ
    for (const e of me.events) {
      if (e === 'fell') { if (holding) release('drop'); banner('セーブ地点からやり直し', 1800); }
      if (e === 'cp') { banner('セーブ！', 1500); hint(world.stage.cps[me.cp].hint); }
      if (e === 'goal') {                                                             // 少し喜んでから、全員で次のステージへ
        const last = stageIndex === STAGES.length - 1, from = run;
        banner(last ? 'ぜんぶクリア！　おめでとう！' : 'ゴール！', last ? 5000 : 2500);
        setTimeout(() => {
          if (run !== from) return;                                                   // ほかの人が先に進めていた
          const next = (stageIndex + 1) % STAGES.length, n = nonce();
          if (room) roomApi.setMatch({ stage: next, n }); else loadStage(next, n);
        }, last ? 5000 : 2500);
      }
    }
    me.events.length = 0;
    if (me.walk) walkT += dt * 11 * Math.min(1.7, Math.hypot(me.hvx, me.hvz) / 4);

    // 見た目を合わせる
    hero.g.position.set(me.x, me.y, me.z); hero.g.rotation.y = me.ry;
    const breathe = Math.sin(time * 2.2);
    const act = heldBy ? ACT.HELD : Math.hypot(me.kvx, me.kvz) > 1.5 ? ACT.OUCH : me.hang && !me.hang.flat ? ACT.HANG
      : holding || grabbing ? ACT.REACH : me.falling ? ACT.FALL : ACT.NONE;
    pose(hero, dt, me.walk, walkT, breathe, act, time, !me.grounded);
    for (const [id, r] of remotes) {
      const g = r.fig.g, mv = r.target[4];
      if (mv) r.walkT += dt * 8;
      pose(r.fig, dt, !!mv, r.walkT, breathe, id === holding ? ACT.HELD : r.target[5], time, g.position.y - world.floorY(g.position.x, g.position.z, g.position.y + 0.01) > 0.15);
    }
    moving.forEach(m => {
      m.userData.fit();
      const k = m.userData.m;                                                         // くずれる床は、落ちる前にがたがた震える。のこぎりは回る
      if (k?.b.hurt) m.rotation.y = time * 9;
      if (k?.mode === 'crumble' && k.clock > 0 && k.clock < 1) m.position.x += Math.sin(time * 70) * 0.04;
    });
    for (const k of belts) k.tex.offset.y -= k.speed * dt / 2;                       // 矢印を、先の向きへ流す
    for (const m of gusts) { m.visible = m.userData.wind.active; m.scale.x = (m.userData.wind.x1 - m.userData.wind.x0) * (0.9 + Math.sin(time * 9) * 0.08); }
    pads.forEach((m, i) => { const p = world.plates[i]; m.material = p.down ? padOnMat : padMat; m.position.y = p.y + (p.down ? 0.02 : 0.06); });
    flags.forEach((f, i) => { f.material = i <= me.cp ? flagOnMat : flagMat; });
    group.userData.ring.rotation.y = time; group.userData.ring.position.y = world.stage.goal.y + 1.5 + Math.sin(time * 2) * 0.15;
    const floor = world.floorY(me.x, me.z, me.y + 0.01);
    shadow.visible = floor > -90; shadow.position.set(me.x, floor + 0.03, me.z); shadow.scale.setScalar(Math.max(0.35, 1 - (me.y - floor) * 0.06));

    // 部屋にいる間：自分の位置を 1 秒に 10 回まで送る（動いたときだけ）。自分が動かした箱の場所も知らせる
    if (room) {
      sendT += dt;
      if (sendT >= 0.1) {
        sendT = 0;
        const s = [me.x, me.y, me.z, me.ry].map(v => Math.round(v * 100) / 100).concat(me.walk ? 1 : 0, act, me.carry ? me.carry.id + 1 : 0);
        if (s.join() !== lastSent) { lastSent = s.join(); roomApi.send(s); }
        for (const c of world.crates) if (c.moved && !c.held) { c.moved = false; c.seen = nonce(); roomApi.putItem('c' + c.id, { p: [c.x, c.y, c.z].map(v => Math.round(v * 100) / 100), n: c.seen, g: run }); }
      }
    }

    // 三人称カメラ：キャラの少し上を中心に、決まった距離で回る（左右・上下にドラッグ）。
    // 高さはキャラの高さだけを、少し遅れて追う。足元に穴があってもカメラは落ちない（跳んでいる間に下を向かない）
    camY += (me.y - camY) * (1 - Math.exp(-dt * 5));
    const flat = Math.cos(pitch) * 6.5;
    camera.position.set(me.x + Math.sin(yaw) * flat, camY + 1.3 + Math.sin(pitch) * 6.5, me.z + Math.cos(yaw) * flat);
    camera.lookAt(me.x, camY + 1.3, me.z);
    renderer.render(scene, camera);
  };
  loadStage(0, 0);
  renderer.setAnimationLoop(frame);

  window.__adv = { get me() { return me; }, get world() { return world; }, get stage() { return stageIndex; }, get state() { return { grabbing, holding, heldBy, run, drag: dragMode(), room: room?.code, players: remotes.size + 1 }; },
    set yaw(v) { yaw = v; }, keys, load: i => loadStage(i, nonce()), jump, grabStart, grabEnd, tick: frame };   // 動作確認用
}
</script>
</body>
</html>
