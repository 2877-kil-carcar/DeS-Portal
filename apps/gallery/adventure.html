    }
    // 世界を 1 コマ進める（ふみ板を押すのは全員の足と箱。持ち上げられている人は押さない）
    // 体の重さは、軽い箱を持っている人が 2。grips は、だれかが回しているハンドル（自分の me.crank と、仲間が知らせてきた s[7]）
    const bodies = [[me.x, me.y, me.z, weight(me.carry)]], grips = me.crank == null ? [] : [me.crank];
    for (const r of remotes.values()) {
      const q = r.fig.g.position, h = r.target[7]; bodies.push([q.x, q.y, q.z, weight(world.crates[r.target[6] - 1])]);
      if (h !== r.mute) { r.mute = -1; if (h > 0) grips.push(h - 1); }                // 手を放した知らせが届いた仲間の s[7] は、値が変わるまで数えない
    }
    const now = room ? roomApi.serverNow() : Date.now();                             // 部屋ではサーバーの時計を使う（端末の時計がずれていても、動く床が全員で同じ位置になる）
    world.step(dt, now, bodies, grips); gripped = grips;

    // 持ち上げている側：仲間がいなくなる・抜けたら放す／持ち上げられている側：相手の手元へ運ばれ、スティックを振ると抜ける
    if (holding) { holdT += dt; const r = remotes.get(holding); if (!r || (holdT > 0.8 && r.target[5] !== ACT.HELD)) release('drop'); }
    if (heldBy) {
      const r = remotes.get(heldBy);
      if (!r || (struggle += Math.abs(ix - lastIx)) > 6) { heldBy = null; me.frozen = false; me.vy = 3; me.grounded = false; }
      else { const g = r.fig.g; me.x = g.position.x + Math.sin(g.rotation.y) * 0.75; me.z = g.position.z + Math.cos(g.rotation.y) * 0.75; me.y = g.position.y + 0.9; me.ry = g.rotation.y + ix * 0.7; me.air = 0.9; }
    }
    lastIx = ix;
    // カメラの向きを基準に前後左右へ動く
    me.step(dt, -Math.sin(yaw) * iy + Math.cos(yaw) * ix, -Math.cos(yaw) * iy - Math.sin(yaw) * ix, dragMode());
    if (me.carry) { world.fit(me.carry); if (!me.carry.heavy) me.carry.on = null; }  // 持っている箱の見た目を手元へ。手に持った箱に足元の床はない（置いて止まるまで、場所を知らせない）
    if (grabbing && !me.grab && !holding) grabbing = false;                          // 世界のほうで手が離れた（ハンドルや重い箱が遠ざかった・やり直し）。押したままでも、つかみ直さない
    /* ハンドルから手が離れたコマ：そのハンドルで動く床ごとに、いまの進み具合と時刻を決め、仲間へ知らせる（ほかの人がまだつかんでいても知らせる）。
       もっと新しい知らせを受け取っていれば、書かない（world.release が新しいほうを残すので、残ったものが自分のものかで分かる） */
    if (lastCrank != null && me.crank !== lastCrank) world.movers.forEach((m, i) => {
      if (m.mode !== 'crank' || !m.handles.includes(lastCrank)) return;
      world.release(i, { f: m.f, t: now });
      if (room && m.last.t === now) { m.seen = nonce(); roomApi.putItem('k' + i, { f: m.f, t: now, n: m.seen, g: run, by: roomMe, h: lastCrank }); }
    });
    lastCrank = me.crank;
    for (const e of me.events) {
      if (e === 'fell') { if (holding) release('drop'); banner('セーブ地点からやり直し', 1800); }
      if (e === 'cp') { banner('セーブ！', 1500); hint(world.stage.cps[me.cp].hint); }
      if (e === 'goal') {                                                             // 少し喜んでから、全員で次のステージへ
        const last = stageIndex === STAGES.length - 1, from = run;
        banner(last ? 'ぜんぶクリア！　おめでとう！' : 'ゴール！', last ? 5000 : 2500);
        setTimeout(() => {
          if (run !== from) return;                                                   // ほかの人が先に進めていた
          const next = (stageIndex + 1) % STAGES.length, n = nonce();
          if (room) roomApi.setMatch({ stage: next, n }); else loadStage(next, n);
        }, last ? 5000 : 2500);
      }
    }
    me.events.length = 0;

    // 見た目を合わせる
    hero.g.position.set(me.x, me.y, me.z); hero.g.rotation.y = me.ry;
    // あみを登っている間も、ぶら下がりの姿勢。ボタンを離して持っている軽い箱にも、手をのばしたまま
    const act = heldBy ? ACT.HELD : Math.hypot(me.kvx, me.kvz) > 1.5 ? ACT.OUCH : me.hang && (!me.hang.flat || me.hang.climb) ? ACT.HANG
      : holding || grabbing || me.carry ? ACT.REACH : me.falling ? ACT.FALL : ACT.NONE;
    pose(hero, dt, act, time, !me.grounded, me.on, me.hang?.climb ? rung(hero, me.hang.b, me.y) : me.hang?.b || me.carry?.box);
    for (const [id, r] of remotes) {
      const f = r.fig, q = f.g.position, a = id === holding ? ACT.HELD : r.target[5], fx = Math.sin(f.g.rotation.y), fz = Math.cos(f.g.rotation.y);
      const under = world.groundBox(q.x, q.z, q.y + 0.01);
      // 仲間がつかんでいる物は、こちらで探す：木箱は番号で分かる。縁と壁は目の前を調べる（よじ登る途中で見失ったら、前のまま）
      const front = a === ACT.HANG || a === ACT.REACH ? world.blocked(q.x + fx * 0.6, q.z + fz * 0.6, q.y) : null;
      f.hold = a === ACT.HANG ? world.ledge(q.x, q.z, q.y, fx, fz) || (front?.climb ? rung(f, front, q.y) : f.hold)
        : a === ACT.REACH ? world.crates[r.target[6] - 1]?.box || front : null;
      // 動く床の上では、通信の合間に床だけが先へ動く。少し浮いて見えても、跳んでいる姿勢にしない
      pose(f, dt, a, time, !under || q.y - under.y1 > (under.m ? 0.5 : 0.15), under, f.hold, 0);
    }
    moving.forEach(m => {
      m.userData.fit();
      const k = m.userData.m;                                                         // くずれる床は、落ちる前にがたがた震える。のこぎりは回る
      if (k?.b.hurt) m.rotation.y = time * 9;
      if (k?.mode === 'crumble' && k.clock > 0 && k.clock < 1) m.position.x += Math.sin(time * 70) * 0.04;
    });
    for (const k of belts) k.tex.offset.y -= k.speed * dt / 2;                       // 矢印を、先の向きへ流す
    for (const m of gusts) {                                                          // せんぷうき箱の風は、箱について回る
      const k = m.userData.wind; m.visible = k.active; if (k.fan) m.userData.fit();
      m.scale.x = (k.x1 - k.x0) * (0.9 + Math.sin(time * 9) * 0.08);
    }
    riseTex.offset.y -= dt * 0.6;
    for (const f of live) f(time, dt, now);
    for (const m of pads) {
      const p = m.userData.p, n = m.userData.pips;
      if (p.needs) m.material = socketMats[+p.down];
      else if (n) {                                                                   // おもさ板：重さ 1 につき、玉が 1 つ光り、板が 2cm 沈む。足りたら緑
        m.material = p.down ? padOnMat : steelMat; m.position.y = p.y + 0.06 - 0.02 * Math.min(p.load, p.need); glow(n, p.load, p.down ? padOnMat : goalMat);
      } else { m.material = p.down ? padOnMat : padMat; m.position.y = p.y + (p.down ? 0.02 : 0.06); }
    }
    flags.forEach((f, i) => { f.material = i === me.cp ? flagNowMat : me.seen.has(i) ? flagOnMat : flagMat; });   // ふれた地点は金色、いまのやり直しの場所はいちばん明るい
    const ob = world.stage.objective;                                                 // 目標（「でんち 1/2」）：数が変わったときだけ書きかえる
    if (ob) {
      let n = 0; for (const i of ob.on) if (world.plates[i]?.down) n++;
      const need = ob.need ?? ob.on.length; n = Math.min(n, need);
      if (n !== chipN) { chipN = n; $('goalChip').textContent = `${ob.label} ${n}/${need}`; }
    }
    group.userData.ring.rotation.y = time; group.userData.ring.position.y = world.stage.goal.y + 1.5 + Math.sin(time * 2) * 0.15;
    const floor = world.floorY(me.x, me.z, me.y + 0.01);
    shadow.visible = floor > -90; shadow.position.set(me.x, floor + 0.03, me.z); shadow.scale.setScalar(Math.max(0.35, 1 - (me.y - floor) * 0.06));

    // 部屋にいる間：自分の位置を 1 秒に 10 回まで送る（動いたときだけ）。自分が動かした箱の場所も知らせる
    if (room) {
      sendT += dt;
      if (sendT >= 0.1) {
        sendT = 0;
        // s = [x, y, z, 向き, 歩いているか, 動作, 持っている箱の番号 + 1, 回しているハンドルの番号 + 1, 何回目の出発か（run）]（箱とハンドルは、なければ 0。古い版は s[7]・s[8] を読まないだけ）
        const s = [me.x, me.y, me.z, me.ry].map(v => Math.round(v * 100) / 100).concat(me.walk ? 1 : 0, act, me.carry ? me.carry.id + 1 : 0, me.crank == null ? 0 : me.crank + 1, run);
        if (s.join() !== lastSent) { lastSent = s.join(); roomApi.send(s); }
        // 箱の場所は、置いて止まってから知らせる（落ちている途中の場所は書かない）。動く床の上なら、その床の番号と、床から見た場所を書く
        for (const c of world.crates) if (c.moved && !c.held && (c.on || c.rail)) {
          const k = world.movers.indexOf(c.on?.m), o = c.on?.m?.o, d = { p: [c.x, c.y, c.z].map((v, i) => Math.round((v - (o ? o[i] : 0)) * 100) / 100), n: c.seen = nonce(), g: run };
          if (o) d.m = k;
          c.moved = false; roomApi.putItem('c' + c.id, d);
        }
      }
    }

    /* 三人称カメラ：キャラの少し上を中心に回る（左右・上下にドラッグ）。見下ろすほど離れ、見上げるほど寄る。
       高さは、地面にいる間とぶら下がっている間だけキャラに合わせる。跳んでいる間は動かさない：ふつうのジャンプでは地平線が揺れない。
       ただし 1.3m より高く上がれば下から追い、0.6m より下へ落ちれば追う（トランポリン・風・穴）。
       やり直しで空へ戻されたときは、足場の高さを目ざす：体を画面の上のほうに入れたまま一緒に下り、最後は足場で待つ（体が上から落ちてきて、べちゃっとつぶれる） */
    if (me.y - camRef > 8 && floor > -90) camRef = camY = floor;
    if (me.grounded || me.hang || me.y < camRef - 0.6) camRef = me.y; else if (me.vy > 0) camRef = Math.max(camRef, me.y - 1.3);
    camY += (camRef - camY) * (1 - Math.exp(-dt * 4));
    camY = Math.min(Math.max(camY, me.y - 2.4), me.y + 1.5);                          // 大砲で打ち上げられても、空から落ちてきても、キャラを画面の外へ出さない
    const far = 4.8 + 1.7 * Math.min(1, Math.max(0, Math.sin(pitch)));
    /* 体とカメラの間に足場や壁が入ったら、その手前までカメラを寄せる（1.5m より近くへは寄せない）。じゃまがなくなれば、毎秒 4m で元の遠さへ戻す。
       木箱・仲間・のこぎりは数えない（小さくて動くので、横切るたびにカメラが跳ねる） */
    const ux = Math.sin(yaw) * Math.cos(pitch), uy = Math.sin(pitch), uz = Math.cos(yaw) * Math.cos(pitch), hy = camY + 1.3;
    let reach = far;
    for (const b of world.list) {
      if (b.crate || b.friend || b.hurt) continue;
      s0 = 0; s1 = reach; slab(me.x, ux, b.x0, b.x1); slab(hy, uy, b.y0, b.y1); slab(me.z, uz, b.z0, b.z1);
      if (s0 > 0 && s0 <= s1) reach = s0;                                             // 頭が中に入っている箱（s0 が 0 のまま）は数えない
    }
    camD = Math.min(reach < far ? Math.max(1.5, reach - 0.3) : far, camD + 4 * dt);
    camera.position.set(me.x + ux * camD, hy + uy * camD, me.z + uz * camD);
    camera.lookAt(me.x, camY + 1.3, me.z);
    renderer.render(scene, camera);
  };
  loadStage(0, 0);
  renderer.setAnimationLoop(frame);

  window.__adv = { get me() { return me; }, get world() { return world; }, get stage() { return stageIndex; }, get state() { return { grabbing, holding, heldBy, run, drag: dragMode(), room: room?.code, players: remotes.size + 1 }; },
    set yaw(v) { yaw = v; }, get yaw() { return yaw; }, keys, load: i => loadStage(i, nonce()), loadObj: st => loadStage(stageIndex, nonce(), st), kit, onRoom, set api(v) { roomApi = v; }, jump, grabStart, grabEnd, tick: frame,
    hero, remotes, makeFigure, view: { renderer, scene, camera, set pitch(v) { pitch = v; } } };   // 動作確認用
}
</script>
</body>
</html>
