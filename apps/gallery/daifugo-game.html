// ===== Firebase listeners =====
function startListeners() {
  // Game state
  onValue(ref(db, `rooms_daifugo/${ROOM}/game`), snap => {
    if (!snap.exists()) return;
    gs = snap.val();
    // Firebaseは空配列/空オブジェクトをキーごと削除するため、必ず初期化しておく
    // （これを怠ると初回あがり時の finished.push などで TypeError → サイレント失敗）
    gs.finished     = gs.finished     || [];
    gs.disqualified = gs.disqualified || [];
    gs.forbidden    = gs.forbidden    || {};
    gs.scores       = gs.scores       || {};
    gs.turnOrder    = gs.turnOrder    || [];

    // Parse phase
    if (gs.phase === 'round_end') {
      document.getElementById('gameScreen').style.display = 'flex';
      document.getElementById('exchangeScreen').classList.remove('show');
      showRoundEnd(gs);
      return;
    }
    if (gs.phase === 'game_end') {
      document.getElementById('gameScreen').style.display = 'flex';
      showGameResult(gs);
      return;
    }
    if (gs.phase === 'exchange') {
      // 結果画面オーバーレイを必ず閉じる（消さないと交換UIに進めずデッドロックする）
      document.getElementById('roundEnd').classList.remove('show');
      document.getElementById('resultScreen').classList.remove('show');
      document.getElementById('gameScreen').style.display = 'none';
      // Load exchange offers then handle
      get(ref(db, `rooms_daifugo/${ROOM}/exchange_offers`)).then(snap => {
        handleExchangePhase({ ...gs, exchange_offers: snap.val() || {} });
      });
      return;
    }

    document.getElementById('exchangeScreen').classList.remove('show');
    document.getElementById('roundEnd').classList.remove('show');
    document.getElementById('gameScreen').style.display = 'flex';

    // Show tenpenchi banner if triggered
    if (gs.tenpenchi_triggered) {
      const banner = document.getElementById('tenpenchiBanner');
      banner.classList.add('show');
      setTimeout(() => banner.classList.remove('show'), 3000);
    }

    // Sub-phase modals (only open if not already open)
    if (gs.subPhase && gs.subPhase.pid === MY_PID) {
      const sp = gs.subPhase;
      const selOpen   = document.getElementById('selectModal').style.display === 'block';
      const queenOpen = document.getElementById('queenModal').style.display === 'block';
      const omenOpen  = document.getElementById('omenModal').style.display === 'block';
      if (!selOpen && !queenOpen && !omenOpen) {
        if (sp.type === 'sevenPass' || sp.type === 'tenDiscard') {
          const played = sp.playedCards || [];
          // 出したカードを「枚数分だけ」除外（値で全消しせず重複を正しく扱う）
          // ※ hands未同期でmyHandにまだ出したカードが残っている場合の保険
          const availHand = removeCards(myHand, played);
          if (availHand.length === 0) {
            // 渡す/捨てるカードがない場合はスキップ（stale選択をリセットしてから）
            selModalCards = [];
            selModalSelected = [];
            window.confirmSelect();
          } else {
            openSelectModal(sp.type, sp.count, availHand);
          }
        } else if (sp.type === 'queenBomb') {
          openQueenModal(sp.count);
        } else if (sp.type === 'omenRev' || sp.type === 'revChoice') {
          openRevChoiceModal(sp.type);
        }
      }
    }

    renderGame(gs);
  });

  // My hand
  onValue(ref(db, `rooms_daifugo/${ROOM}/hands/${MY_PID}`), snap => {
    myHand = snap.val() || [];
    selected = []; // clear selection when hand changes to prevent stale indices → TypeError
    if (gs) renderHand();
  });

  // 全員の手札を取得。通常は「枚数」だけUI表示（裏向き）。
  // ただし自分があがり/都落ち等で非アクティブになったら観戦者として実カードを表示する。
  onValue(ref(db, `rooms_daifugo/${ROOM}/hands`), snap => {
    allHands = snap.val() || {};
    handCounts = {};
    for (const pid in allHands) handCounts[pid] = (allHands[pid] || []).length;
    if (gs) renderOppZones(gs);
  });

  // Players
  onValue(ref(db, `rooms_daifugo/${ROOM}/players`), snap => {
    if (snap.exists()) players = snap.val();
  });

  // ── 切断検知（猶予つき・緩め） ──
  // .info/connected を使い、接続するたびに onDisconnect を再登録＆自分のフラグを消す（復帰扱い）。
  // 一瞬の通信断（画面ロック/タブ切替/電波揺れ）で即落とさないよう、ホストは猶予後に再確認してから処理。
  const myDiscRef = ref(db, `rooms_daifugo/${ROOM}/disconnected/${MY_PID}`);
  onValue(ref(db, '.info/connected'), (snap) => {
    if (snap.val() === true) {
      onDisconnect(myDiscRef).set(true);  // 切断したらフラグが立つよう予約（毎回登録し直す）
      set(myDiscRef, null);               // 今オンライン → フラグを消す
    }
  });

  const DISCONNECT_GRACE_MS = 120000; // 2分つながらなければ切断とみなす（猶予）
  const pendingDisc = {};            // pid -> timeoutId

  async function retireDisconnected(pid) {
    if (!gs || !isHost) return;
    if (!gs.turnOrder || !gs.turnOrder.includes(pid) || !isActive(pid, gs)) return;
    let newGs = JSON.parse(JSON.stringify(gs));
    retirePlayer(pid, newGs);
    showToast(`${players[pid]?.name || pid} が切断しました`);
    const updates = {};
    updates[`rooms_daifugo/${ROOM}/disconnected/${pid}`] = null;
    updates[`rooms_daifugo/${ROOM}/left/${pid}`] = true; // 次ラウンド以降は除外
    // サブアクション待ちだった場合は破棄してゲーム停止を防ぐ
    if (newGs.subPhase && newGs.subPhase.pid === pid) {
      newGs.subPhase = null;
      newGs.subPhaseQueue = null;
      if (newGs.turn === pid) newGs.turn = nextActivePid(pid, newGs);
    }
    if (shouldEndRound(newGs)) {
      await endRound(newGs);
    } else {
      if (newGs.turn === pid) newGs.turn = nextActivePid(pid, newGs);
      updates[`rooms_daifugo/${ROOM}/game`] = newGs;
      await update(ref(db), updates);
    }
  }

  // ホストのみ：切断フラグを監視。猶予タイマー後に「まだ切断中か」を再確認してからリタイア。
  onValue(ref(db, `rooms_daifugo/${ROOM}/disconnected`), (snap) => {
    if (!gs || !isHost) return;
    const disc = snap.val() || {};
    // フラグが消えた人（＝復帰）は予約キャンセル
    for (const pid in pendingDisc) {
      if (!disc[pid]) { clearTimeout(pendingDisc[pid]); delete pendingDisc[pid]; }
    }
    for (const pid in disc) {
      if (!disc[pid] || pendingDisc[pid]) continue;
      if (!gs.turnOrder || !gs.turnOrder.includes(pid) || !isActive(pid, gs)) continue;
      pendingDisc[pid] = setTimeout(async () => {
        delete pendingDisc[pid];
        const still = (await get(ref(db, `rooms_daifugo/${ROOM}/disconnected/${pid}`))).val();
        if (still) await retireDisconnected(pid); // 猶予後もまだ切断 → リタイア
      }, DISCONNECT_GRACE_MS);
    }
  });

  // 永続離脱プレイヤー listener
  onValue(ref(db, `rooms_daifugo/${ROOM}/left`), snap => {
    leftPlayers = snap.val() || {};
  });

  // 自分のカード交換結果（渡した/受け取った）を通知 → 表示後に消す
  onValue(ref(db, `rooms_daifugo/${ROOM}/exchange_log/${MY_PID}`), snap => {
    const log = snap.val();
    if (!log) return;
    const fmt = (arr) => (arr || []).map(c => c.s === 'JK' ? 'JK' : (NUM_LABEL[c.n] + SUIT_SYM[c.s])).join(' ') || 'なし';
    showToast(`交換 🔁 渡した: ${fmt(log.gave)} ／ 受け取った: ${fmt(log.got)}`);
    set(ref(db, `rooms_daifugo/${ROOM}/exchange_log/${MY_PID}`), null);
  });

  // チャット listener
  onValue(ref(db, `rooms_daifugo/${ROOM}/chat`), snap => {
    renderChat(snap.val() || {});
  });

  // Exchange offers listener — refresh exchange screen when offers change
  onValue(ref(db, `rooms_daifugo/${ROOM}/exchange_offers`), snap => {
    if (!gs || gs.phase !== 'exchange') return;
    // Re-run exchange phase handler with latest offers
    const updatedGs = { ...gs, exchange_offers: snap.val() || {} };
    handleExchangePhase(updatedGs);
  });

  // 都落ち: host watches for first finisher and applies toshiochi
  onValue(ref(db, `rooms_daifugo/${ROOM}/game/finished`), async snap => {
    if (!snap.exists() || !gs || !isHost) return;
    const finished = snap.val() || [];
    if (finished.length !== 1) return; // Only trigger on first finisher
    if (!rules.toshiochi) return;
    const firstPid = finished[0];
    const prevDaifugo = getPrevDaifugo(gs);
    if (!prevDaifugo || prevDaifugo === firstPid) return;
    if (!isActive(prevDaifugo, gs)) return;
    showToast(`${players[prevDaifugo]?.name || prevDaifugo} 都落ち！`);

    // game全体を transaction で更新（他プレイヤーの同時手番更新を巻き戻さない）
    let endTriggered = null;
    await runTransaction(ref(db, `rooms_daifugo/${ROOM}/game`), (cur) => {
      if (!cur) return cur;
      cur.finished     = cur.finished     || [];
      cur.disqualified = cur.disqualified || [];
      cur.forbidden    = cur.forbidden    || {};
      // 既に処理済み/対象が非アクティブなら何もしない（冪等）
      if (cur.disqualified.includes(prevDaifugo) || cur.forbidden[prevDaifugo]) return; // abort
      retirePlayer(prevDaifugo, cur);
      return cur;
    });
    // transaction後の状態でラウンド終了判定（必要ならendRound）
    const after = (await get(ref(db, `rooms_daifugo/${ROOM}/game`))).val();
    if (after && shouldEndRound(after)) { await endRound(after); }
  });
}

// ===== Init =====
async function init() {
  // Load room
  const snap = await get(ref(db, `rooms_daifugo/${ROOM}`));
  if (!snap.exists()) { location.href = 'daifugo.html'; return; }
  const room = snap.val();
  players = room.players || {};
  rules = { ...DEFAULT_RULES, ...(room.rules || {}) };
  isHost = room.host === MY_PID;

  document.getElementById('loadingScreen').style.display = 'none';
  startListeners();
}

init();
</script>
